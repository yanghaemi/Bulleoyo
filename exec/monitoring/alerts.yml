# 메모리 알림 규칙 — **알리기만 한다. 죽이지 않는다.**
#
# 죽이는 일은 커널 OOM killer 가 이미 한다. 그 위에 사용자 공간 킬러를 하나 더 만들면
# "무엇이 필요없는 프로그램인가" 를 코드가 추측하게 되는데, Jenkins 를 배포 중에 죽이거나
# MySQL 을 죽이면 살리려던 것보다 잃는 것이 크다. 대신 **누가 먼저 죽어야 하는지**는
# 배포 스크립트가 oom_score_adj 로 커널에 알려 둔다(exec/deploy/blue-green.sh) — 컨테이너
# 안에서 자기 PID1 에 쓴다. 실패하면 배포 로그에 ⚠ 가 찍히고, 그때는 이 보장이 없다.
#
# used 가 아니라 available 로 판정한다. 리눅스에서 buff/cache 는 회수 가능해서
# "used 95%" 는 대개 정상이다 — 실측(2026-09-11)에서 used 26% 인데 buff/cache 까지
# 세면 81% 였고 available 은 74% 였다. 기준을 잘못 잡으면 평상시에 계속 울린다.
groups:
  - name: memory
    rules:
      - alert: HostMemoryAvailableLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.15
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "호스트 메모리 여유 15% 미만"
          description: "available {{ $value | humanizePercentage }}. 배포를 시작하면 blue-green.sh 가 거절한다."

      - alert: HostMemoryAvailableCritical
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.08
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "호스트 메모리 여유 8% 미만 — OOM 이 임박했다"
          description: "available {{ $value | humanizePercentage }}. 배포가 쉬는 색의 oom_score_adj 를 800 으로 올려 두지만(blue-green.sh), 그 설정이 실패하면 배포 로그에 ⚠ 가 찍힌다 — 그때는 커널이 돌고 있는 색을 고를 수 있다."

      # 색 하나가 자기 상한(기본 3g)에 붙는 것이 블루/그린에서 가장 먼저 보이는 신호다.
      # 상한이 있으므로 호스트를 먹지는 않지만, 그 컨테이너는 곧 OOM 으로 죽는다.
      - alert: ContainerNearMemoryLimit
        expr: |
          container_spec_memory_limit_bytes{name!=""} > 0
          and
          container_memory_working_set_bytes{name!=""}
            / container_spec_memory_limit_bytes{name!=""} > 0.9
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.name }} 가 메모리 상한의 90% 를 넘었다"
          description: "{{ $value | humanizePercentage }}. 상한을 올리거나 누수를 본다."

      # 실제로 누가 죽은 사건. 가장 신호가 세다 — 조용히 지나가면 안 된다.
      - alert: HostOOMKill
        expr: increase(node_vmstat_oom_kill[10m]) > 0
        labels: { severity: critical }
        annotations:
          summary: "OOM killer 가 프로세스를 죽였다"
          description: "최근 10분 {{ $value }}건. docker ps 로 무엇이 사라졌는지 확인한다."

  # 체인 작업이 멈춘 것. **조용한 정지가 이 프로젝트에서 가장 비싼 상태다** — ChainOwnership 은
  # 모르면 쉬는 쪽을 고르므로(Redis 못 읽음·chain:active 가 뜨지 않은 색을 가리킴), 아무도 일하지
  # 않아도 에러 로그가 없다. job 이 쌓이는 것만이 그 신호다(리뷰 !170 🟡).
  #
  # 활성 색(job=backend)만 본다 — backend_color 잡이 같은 지표를 색별로 또 긁어서, 잡을 안 고르면
  # 같은 사건으로 알림이 두세 개 뜬다.
  #
  # OPERATOR job 만 센다(S15P21B204-186). USER 서명 대기 job 도 PENDING 이라(최대 120초, 그 뒤 만료)
  # 판매가 이어지는 동안 상시 >0 이고, 섞어 세면 이 경보가 성수기에 늘 울려 무시된다(리뷰 !170 🟡).
  #
  # 그래도 "10분간 OPERATOR tx 확정이 하나도 없었다" 를 같이 본다(리뷰 !215 🟡). OPERATOR 지갑은 큐가
  # 하나라 직렬이고, job 하나가 RPC 네 번(estimateGas·pendingNonce·gasPrice·sendRaw)이라 공개 RPC 에서
  # 초당 1~2건이다. 공연 취소 일괄 환불은 주문마다 REFUND job 을 만들어 수백 건이 한 큐에 쌓이므로
  # 정상 처리 중에도 PENDING 이 10분을 넘길 수 있다. 확정 진척은 OPERATOR 가 보내는 타입
  # (ContractOperatorTxBuilder.SUPPORTED)으로만 좁힌다 — USER 타입(PURCHASE 등) 확정이 OPERATOR 정지를
  # 가리지 않게. 이 목록에 타입이 늘면 여기도 늘린다.
  #
  # 진척은 b204_chain_tx_seconds_count 로 본다 — receipt 확정마다 1 오르는 **카운터**라 increase 가
  # 재기동·색 전환의 리셋을 알아서 처리한다(리뷰 !170 🟡).
  #
  # and 가 아니라 unless on(job) 이다. and 는 양쪽 라벨셋이 같아야 매칭되는데 status·type 이 달라
  # **영원히 빈 벡터**였다(리뷰 !170 🔴). unless 는 "확정이 있었으면 뺀다" 라, 타이머 시계열이 아직
  # 없을 때(기동 뒤 첫 확정 전)도 PENDING 만으로 울린다.
  - name: chain
    rules:
      - alert: ChainJobBacklog
        expr: |
          b204_chain_job_count{job="backend", status="PENDING", signer_type="OPERATOR"} > 0
          unless on(job)
          sum by (job) (increase(b204_chain_tx_seconds_count{job="backend", type=~"MINT|CREATE_SHOW|START_SALE|UPDATE_RULES|LOCK|AGGREGATE|RELEASE|HALT|DEPOSIT_RETURN|REFUND"}[10m])) > 0
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "OPERATOR chain_job PENDING 이 10분 넘게 남아 있다"
          description: "{{ $value }}건. 아무도 체인 작업을 하지 않는 상태일 수 있다 — `docker exec b204-redis redis-cli MGET chain:active chain:owner` 로 활성 색과 소유자를 본다. 활성 색이 죽은 색을 가리키면 살아 있는 색으로 넘긴다: `cd ~/app && deploy/rollback.sh`(트래픽도 함께) 또는 `docker exec b204-redis redis-cli SET chain:active <산 색>`(체인만). 소유자가 살아 있는데 특정 tx 타입만 남아 있으면 빌더 미지원(OperatorTxBuilder.supports 가 false)을 의심한다."

  # 알림 자체가 못 나가는 경우. 이 알림도 Mattermost 로는 못 가지만(같은 경로가 고장났다)
  # Prometheus·Grafana 화면에는 뜬다 — 아무 흔적도 없는 것보다 낫다.
  - name: alerting-health
    rules:
      - alert: AlertDeliveryFailing
        expr: increase(alertmanager_notifications_failed_total[15m]) > 0
        labels: { severity: critical }
        annotations:
          summary: "Alertmanager 가 알림을 못 보내고 있다"
          description: "최근 15분 {{ $value }}건 실패. secrets/mattermost_url 이 있는지, 디렉토리가 아닌 파일인지 본다."

      # 위 규칙은 **alertmanager 가 살아서 자기 지표를 내줄 때만** 발화한다. 설정이 잘못돼
      # 기동 자체가 실패하면(promtool 은 alertmanager.yml 을 보지 않는다) 메모리·OOM·chain
      # 알림이 전부 조용히 사라진다 — 그것을 알리는 것이 이 규칙이다(리뷰 !170 🔴).
      - alert: AlertmanagerDown
        expr: up{job="alertmanager"} == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Alertmanager 가 떠 있지 않다 — 모든 알림이 나가지 않는다"
          description: "cd ~/monitoring && docker compose -f docker-compose.monitoring.yml logs alertmanager | tail. 설정 검사는 docker run --rm -v $PWD:/c prom/alertmanager:v0.28.1 amtool check-config /c/alertmanager.yml 이다."

      # 백엔드 지표가 안 들어오면 위 ChainJobBacklog 도 영영 발화하지 않는다. job 으로 한정해
      # 쉬는 색 타깃(backend_color)은 걸리지 않게 한다 — 그쪽은 DOWN 이 정상이다.
      - alert: BackendMetricsDown
        expr: up{job="backend"} == 0
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "활성 색 지표가 10분째 안 들어온다 — chain 알림도 같이 멈춰 있다"
          description: "curl -s localhost:9091/api/v1/targets 로 backend 타깃을 본다. prometheus 가 app_default 네트워크에 붙어 있어야 b204-router 이름이 풀린다."

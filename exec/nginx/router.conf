# b204-router — 백엔드 블루/그린 전환점.
#
# 호스트 Nginx 는 이 컨테이너(127.0.0.1:8080)만 본다. 그래서 색을 바꿔도
# 호스트 설정은 그대로고, 수동 reload(sudo systemctl)가 필요 없다 —
# Jenkins 는 컨테이너 안이라 호스트 systemctl 을 못 부른다.
#
# 전환은 active_color.conf 한 줄을 바꾸고 이 컨테이너만 reload 하는 것이다:
#   docker exec b204-router nginx -s reload
#
# 색 파일은 conf.d/ 바깥에 둔다. 거기에 두면 nginx 기본 설정의
# include /etc/nginx/conf.d/*.conf 가 이 파일을 **http 레벨**에서 먼저 읽어
# "set directive is not allowed here" 로 기동이 죽는다(로컬 실측).
# nginx reload 는 기존 연결을 끝까지 처리하고 새 연결만 새 워커로 보낸다.

# 도커 임베디드 DNS. proxy_pass 를 변수로 쓰면 기동 시점이 아니라 요청 시점에
# 이름을 푼다 — 반대쪽 색이 아직 없어도 router 가 죽지 않는다.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;

    # router 자신이 살아 있는지. 백엔드와 무관하게 200 이어야 한다.
    location = /router/health {
        access_log off;
        return 200 "router ok\n";
    }

    # 전환 확인용 — **지금 워커가 보는 색**. 두 색이 모두 healthy 면 /actuator/health 200 만으로는
    # reload 가 먹었는지 알 수 없다(리뷰 !170 🟡). 응답 헤더로 내지 않는 이유: 호스트 Nginx 가
    # /api/ 응답을 그대로 밖으로 넘겨 내부 컨테이너 이름·포트가 공개 API 에 실린다. 이 경로는
    # 호스트 Nginx 가 넘기지 않으므로(/api/ 만 8080 으로) 서버 안에서만 보인다.
    location = /router/color {
        access_log off;
        include /etc/nginx/b204/active_color.conf;
        default_type text/plain;
        return 200 "$b204_backend\n";
    }

    location / {
        include /etc/nginx/b204/active_color.conf;
        proxy_pass http://$b204_backend;

        proxy_http_version 1.1;
        # 호스트 Nginx 가 이미 신뢰 경계에서 헤더를 정리했다. 여기서는 그대로 넘긴다 —
        # 다시 쓰면 $remote_addr 이 router 컨테이너 IP 라 IP 한도(§0.9)가 통째로 깨진다.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $http_x_real_ip;
        proxy_set_header X-Forwarded-For   $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host  $http_x_forwarded_host;
        proxy_set_header X-Forwarded-Port  $http_x_forwarded_port;
        proxy_set_header Forwarded          "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Ssl    "";

        proxy_read_timeout 60s;
        client_max_body_size 10m;
    }
}

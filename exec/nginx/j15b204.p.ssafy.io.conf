# 호스트 Nginx 사이트 설정 — 서버에서 사람이 반영한다.
#
# Jenkins는 컨테이너 안이라 호스트 systemctl을 못 부른다. 이 파일이 바뀐 커밋은 파이프라인이
# 경고만 남기고, 반영은 손으로 한다(exec/README.md "인프라 파일 위치"):
#   cp exec/nginx/*.conf ~/app/nginx/ && sudo nginx -t && sudo systemctl reload nginx
# 서버 1회 작업(포팅 매뉴얼 exec/01_포팅_매뉴얼.md §6.1 4단계): sites-enabled에서 default 링크를 지우고 이 파일을 심볼릭 링크로 건다.
#   sudo ln -sf /home/ubuntu/app/nginx/j15b204.p.ssafy.io.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#
# 인증서는 발급 완료 상태다(만료 2026-12-04, systemd 타이머가 갱신).
# 인증서가 없는 새 서버는 이 파일을 걸기 전에 발급한다 — 포팅 매뉴얼(exec/01_포팅_매뉴얼.md) §6.1 4-a.
# certbot을 다시 돌리지 않으므로 443 블록을 여기에 완성형으로 둔다.

server {
    listen 80;
    listen [::]:80;
    server_name j15b204.p.ssafy.io;

    # 인증서 갱신용. 리다이렉트보다 먼저 매치돼야 한다.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name j15b204.p.ssafy.io;

    ssl_certificate     /etc/letsencrypt/live/j15b204.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/j15b204.p.ssafy.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10m;

    # --- 신뢰 경계: 전달 헤더는 여기서 전부 새로 쓴다 ---------------------------------
    # 체인은 [클라이언트 → 이 nginx → 127.0.0.1 업스트림] 하나뿐이다. 앞단에 CDN·ALB가 없고
    # 업스트림 포트(8080·3000·9090·3001)는 전부 127.0.0.1 바인딩이라 nginx를 건너뛸 수 없다.
    # 따라서 $remote_addr가 곧 실제 클라이언트 IP이고, 클라이언트가 보낸 X-Forwarded-*·Forwarded는
    # 전부 위조값이다. $proxy_add_x_forwarded_for(= 클라이언트 값 + $remote_addr)를 쓰면
    # Spring ForwardedHeaderFilter가 목록의 첫 요소를 getRemoteAddr()로 채택해서
    # IP 기준 한도(§0.9 로그인 60회/분·검표 60회/분)가 요청마다 우회된다. 그래서 덮어쓴다.
    #
    # Spring ForwardedHeaderFilter가 신뢰하는 헤더는 7개다(spring-web 6.2 FORWARDED_HEADER_NAMES):
    # Forwarded · X-Forwarded-{For,Host,Port,Proto,Prefix,Ssl}. 그래서 X-Forwarded-For 하나만
    # 덮어써도 부족하다 — Forwarded(RFC 7239)는 X-Forwarded-For보다 우선순위가 높아 for= 값으로
    # 다시 우회된다. 7개를 전부 nginx가 정하거나(값 지정) 버린다(빈 문자열 = 업스트림에 미전달).
    # 브라우저는 이 헤더들을 보내지 않으므로 버려서 깨지는 정상 요청은 없다.
    #
    # 앞단에 CDN·로드밸런서를 넣게 되면 이 방식은 진짜 클라이언트 IP를 지운다. 그때는
    # 덮어쓰기를 되돌리는 대신 real_ip 모듈로 바꾼다(런북 참조):
    #   set_real_ip_from <LB CIDR>; real_ip_header X-Forwarded-For; real_ip_recursive on;
    # 그러면 $remote_addr가 실제 클라이언트로 치환되므로 아래 줄들은 그대로 둬도 맞다.

    gzip on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Actuator는 외부에 노출하지 않는다. 헬스체크는 컨테이너 내부에서만.
    location /actuator/ {
        return 404;
    }

    # Jenkins 컨트롤러(127.0.0.1:9090). /jenkins 접두사는 Jenkins의 --prefix가 처리하므로
    # proxy_pass 에 경로를 붙이지 않는다(붙이면 이중 접두사로 404가 난다).
    # GitLab 웹훅 수신기(exec/jenkins/notify). 정확히 이 경로만, 나머지 /hooks/* 는 없음(404).
    location = /hooks/gitlab {
        proxy_pass http://127.0.0.1:9092;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 2m;
    }

    location = /jenkins {
        return 301 /jenkins/;
    }

    location /jenkins/ {
        proxy_pass http://127.0.0.1:9090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # 덮어쓰기($proxy_add_x_forwarded_for 아님). Jenkins는 이 값을 로그인 실패·감사 로그의
        # 접속 IP로 남긴다 — 이어 붙이면 익명 요청자가 감사 로그의 IP를 위조할 수 있다.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header Forwarded          "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Ssl    "";

        # 파일 업로드(플러그인 .hpi)·CLI 스트리밍용. 버퍼링을 끄지 않으면 CLI가 멈춘다.
        proxy_request_buffering off;
        proxy_read_timeout 90s;
        client_max_body_size 100m;
    }

    # 설계 정본 Swagger UI(정적). develop 머지마다 파이프라인이 docs/design/api/ 를
    # ~/app/docs/ 로 복사한다. 개발자만 보게 basic auth를 건다(런북 v2 §4-1).
    # alias 는 location 과 끝 슬래시가 둘 다 있어야 경로가 어긋나지 않는다.
    location = /docs {
        return 301 /docs/;
    }

    location /docs/ {
        alias /home/ubuntu/app/docs/;
        index index.html;
        auth_basic "B204 dev";
        auth_basic_user_file /etc/nginx/.htpasswd_b204;
        add_header Cache-Control "no-store";
    }

    # Grafana(127.0.0.1:3001). GF_SERVER_SERVE_FROM_SUB_PATH=true 라 경로를 그대로 넘긴다.
    # Upgrade 헤더는 Grafana Live(대시보드 실시간 갱신) 웹소켓용.
    location = /grafana {
        return 301 /grafana/;
    }

    location /grafana/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # 덮어쓰기. Grafana는 X-Forwarded-For를 접속 로그·auth.proxy 화이트리스트 판정에 쓰고,
        # X-Forwarded-Host는 절대 URL 조립에 쓴다 — 둘 다 클라이언트가 정하면 안 된다.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header Forwarded          "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Ssl    "";
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 90s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # 여기가 한도(rate limit)의 주체가 정해지는 자리다. 백엔드는
        # server.forward-headers-strategy: framework 라 ForwardedHeaderFilter가
        # X-Forwarded-For의 첫 요소를 getRemoteAddr()로 채택한다. 이어 붙이면(= 이전 설정)
        # 클라이언트가 보낸 값이 첫 요소가 되어 §0.9 IP 한도가 무력화된다. 반드시 덮어쓴다.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 아래 셋도 ForwardedHeaderFilter가 읽는 입력이다. 설정하지 않으면 클라이언트가 보낸 값이
        # 그대로 업스트림에 전달된다. 특히 Forwarded(RFC 7239)는 X-Forwarded-*보다 우선순위가
        # 높아서, 비우지 않으면 X-Forwarded-For를 덮어써도 for= 값으로 다시 우회된다.
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header Forwarded          "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Ssl    "";
        proxy_read_timeout 60s;
    }

    # 사용자 업로드 파일(포스터). 백엔드 컨테이너가 바인드 마운트(/app/uploads)로 쓰고 여기서 읽기만 한다.
    # alias 는 /docs/ 와 같은 규칙 — location 과 alias 둘 다 끝 슬래시가 있어야 경로가 어긋나지 않는다.
    # nginx 는 접두사 location 을 파일 순서가 아니라 **최장 일치**로 고르므로 /uploads/ 가 아래 / 를
    # 이긴다. 순서는 무관하지만 읽는 사람이 가리는 관계를 바로 보게 / 앞에 둔다.
    # 파일명이 uuid(uploads/p/{yyyyMM}/{uuid}.{ext})라 내용이 바뀌면 이름도 바뀐다 → 영구 캐시가 안전하다.
    location /uploads/ {
        alias /home/ubuntu/app/uploads/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        # 여기 들어오는 건 전부 남이 올린 바이트다. 서비스와 **같은 오리진**이라, text/html 이나
        # image/svg+xml 로 서빙되는 순간 그 파일의 스크립트가 j15b204.p.ssafy.io 의 DOM·스토리지에
        # 접근한다(저장형 XSS). 백엔드가 시그니처로 jpeg·png·webp 만 받고 확장자도 거기서 파생하지만,
        # 그 판정이 한 번 뚫리면 여기가 마지막 문이다.
        #   · nosniff  — 확장자로 정해진 타입을 브라우저가 내용 보고 바꾸지 못하게 한다
        #   · 아래 deny — .html/.svg 등 렌더되는 확장자는 애초에 서빙하지 않는다(정상 파일엔 없는 확장자)
        add_header X-Content-Type-Options nosniff;
        location ~* \.(html?|svg|svgz|xml|js|mjs)$ { return 404; }
    }

    # 프론트 정적 빌드(컨테이너 안 nginx). 여기서 IP로 판정하는 로직은 없지만, 신뢰 경계를
    # 자리마다 다르게 두면 나중에 이 블록을 복사해 새 프록시를 만들 때 취약한 쪽이 퍼진다.
    # 위 블록들과 같은 규칙을 적용한다.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header Forwarded          "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Ssl    "";
    }
}

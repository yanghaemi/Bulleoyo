# 지금 트래픽을 받는 색. 배포 스크립트가 이 파일 하나를 덮어쓴다.
#
# **exec/nginx/ 에 두지 않는다.** 런북의 Nginx 수동 반영이 `cp exec/nginx/*.conf ~/app/nginx/`
# 글롭이라(Jenkinsfile 의 안내), 거기 두면 사람이 그 명령을 따라 칠 때 **돌고 있는 색이
# blue 기본값으로 되돌아간다** — router 가 reload 되는 순간 트래픽이 넘어가고, active_color
# 상태 파일과 어긋나 다음 배포가 **트래픽을 받는 색을 재생성한다**(리뷰 !93 2차 🔴).
set $b204_backend "b204-backend-blue:8080";

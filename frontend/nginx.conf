# 컨테이너 내부 nginx — 정적 파일 + SPA fallback만 한다.
# HTTPS·프록시·도메인은 호스트 Nginx(exec/nginx/) 담당.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite 산출물은 파일명에 해시가 붙는다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

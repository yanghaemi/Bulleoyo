        본다). [2026-09-09] 보증금 선행 조건은 없다 — createShow 가 rulesHash!=0 을 요구하고 deposit 이 createShow 를 요구해 순환이 되기 때문이다. 순서는 규칙
        → createShow → 보증금 → 동의 → 판매 시작이며 보증금 검증은 판매 시작(rule-04)이 한다. 잘못된 상태면 PERFORMANCE_INVALID_STATUS(409)로 막는다. 저장할 때마다

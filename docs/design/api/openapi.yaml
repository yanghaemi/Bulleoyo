      description: '리더가 서명·전송한 agreeToRules tx의 발신자 서명 RLP를 보고한다. 서버는 202 + jobId(signerType=USER)를 주고 receipt와 동의 이벤트를 검증한다(§0.4).
        보고 즉시 rule_agreement가 PENDING → SIGNING, receipt 확정 시 → AGREED로 전이하며, 검증 실패는 PENDING으로 되돌리고 chain_job을 FAILED로 고정한다.
        마지막 검증 항목인 rulesHash가 서버 현재 해시와 다르면 RULE_HASH_MISMATCH(409)다. 전 참여팀이 AGREED가 되면 응답에 allAgreed: true·startSaleAvailable:
        true가 내려간다. 같은 RLP 재보고는 최초 jobId를 재생하지만, 규칙 동기화 중(UPDATE_RULES 미확정·실패)에는 같은 RLP 재보고도 RULE_SYNC_IN_PROGRESS(409)이며
        기존 job 멱등 응답을 주지 않는다(동기화 판정이 재생 판정보다 앞이다).

        '

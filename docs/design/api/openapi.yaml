  /api/v1/wallets:
    post:
      operationId: wallet_04
      tags:
      - wallet
      summary: 지갑 등록(첫 1회 선택)
      description: 요청 본문 provider가 WEB3AUTH면 소셜 로그인으로 만들어진 MPC 지갑을, EXTERNAL이면 사용자가 이미 쓰는 지갑(MVP는 Kaia Wallet)을 한 엔드포인트로 등록한다.
        회원당 첫 1회만 성공하며 이미 지갑이 있으면 409다. WEB3AUTH는 idToken wallets 클레임 주소 대조로, EXTERNAL은 wallet_03이 발급한 nonce·signature를 ecrecover로
        검증(성공 시 챌린지 1회용 삭제)한다. 등록 성공 즉시 기본 지급 MINT job(100000 YoYo, 멱등키 grant:signup:{memberId})을 걸며 온체인 확정을 기다리지 않으므로 202를
        반환한다. 지급 실패해도 지갑 등록 자체는 성공으로 남고 관리자 재지급(coin_07)으로 복구한다. Idempotency-Key 헤더는 요구하지 않는다("회원당 1개" 제약과 회원 단위 지급 멱등키가 중복을
        막는다).

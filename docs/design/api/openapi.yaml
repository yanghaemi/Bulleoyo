          type: string
          description: 0x + 130 hex(132자). EXTERNAL만 필수.
        walletLabel:
          type: string
          maxLength: 20
          description: KAIA_WALLET / METAMASK 등 표시용 라벨.
    WalletLinkResponse:
      type: object
      description: §0.3 표준 ChainJobAccepted(jobId/status/pollAfterMs)보다 넓은, 지갑 등록 전용 202 응답 바디. wallet·grantJobId·signupGrant를
        함께 담는다.
      properties:
        wallet:
          $ref: '#/components/schemas/WalletLinkedSummary'
        grantJobId:
          type: string
          description: 기본 지급 MINT job 식별자. API-chain-01로 폴링한다.
        signupGrant:
          $ref: '#/components/schemas/WalletSignupGrant'
        pollAfterMs:
          type: integer
    WalletLinkedSummary:
      type: object
      properties:
        walletId:
          type: integer
          format: int64
        provider:
          type: string
          enum:
          - WEB3AUTH
          - EXTERNAL
        walletLabel:
          type: string
        address:
          $ref: '#/components/schemas/Address'
        status:
          type: string
          enum:
          - LINKED
          - SUSPENDED
        verifiedAt:
          type: string
          format: date-time
        explorerUrl:
          type: string
          format: uri
    WalletMe:
      type: object
      required:
      - stale
      properties:
        walletId:
          type: integer
          format: int64
        provider:
          type: string
          enum:
          - WEB3AUTH
          - EXTERNAL
        address:
          $ref: '#/components/schemas/Address'
        status:
          type: string
          enum:
          - LINKED
          - SUSPENDED
        verifiedAt:
          type: string
          format: date-time
        balance:
          $ref: '#/components/schemas/WalletBalance'
        pendingGrantJobId:
          type:
          - string
          - 'null'
          description: 지갑 등록 시 걸린 기본 지급 MINT job이 아직 CONFIRMED가 아니면 그 jobId. 확정 후 null.
        network:
          type: string
          enum:
          - kaia-kairos
          - besu-private
        chainId:
          type: integer
        tokenAddress:
          $ref: '#/components/schemas/Address'
        explorerUrl:
          type: string
          format: uri
        cachedAt:
          type: string
          format: date-time
        stale:
          type: boolean
    WalletRateInfo:
      type: object
      properties:
        currency:
          type: string
        rate:
          type: number
        asOf:
          type: string
          format: date-time
    WalletSignupGrant:
      type: object
      required:
      - amount
      properties:
        amount:
          $ref: '#/components/schemas/Money'
        currency:
          type: string
          enum:
          - KRW
        display:
          $ref: '#/components/schemas/Display'
    WalletTransactionItem:
      type: object
      properties:
        walletTxId:
          type: string
        type:
          type: string
          enum:
          - GRANT
          - PURCHASE
          - REFUND
          - RELEASE
          - DEPOSIT
          - DEPOSIT_RETURN
        direction:
          type: string
          enum:
          - IN
          - OUT
        amount:
          $ref: '#/components/schemas/Money'
        currency:
          type: string
          enum:
          - KRW
        status:
          type: string
          enum:
          - PENDING
          - SUBMITTED
          - CONFIRMED
          - FAILED
        refType:
          type: string
          description: 참조 원본 종류 — ORDER(PURCHASE, refId 는 주문) / SETTLEMENT_SHARE(RELEASE) / PERFORMANCE(DEPOSIT_RETURN) /
            CHAIN_JOB(GRANT·REFUND·DEPOSIT, 그리고 결제 링크가 없는 이전 PURCHASE). walletTxId 접두도 원본을 따른다(job_·pay_·share_·deposit_return_).
            문서에 고정 ENUM으로 명시되지 않는다.
        refId:
          type: integer
          format: int64
        title:
          type: string
        signerType:
          type: string
          enum:
          - OPERATOR
          - USER
        feeDelegated:
          type: boolean
          description: signerType=USER 행은 항상 true. OPERATOR 행은 false.
        txHash:
          $ref: '#/components/schemas/TxHash'
        explorerUrl:
          type: string
          format: uri
        occurredAt:
          type: string
          format: date-time
    WalletTransactionListResponse:
      type: object
      properties:
        rate:
          $ref: '#/components/schemas/WalletRateInfo'
        items:
          type: array
          items:
            $ref: '#/components/schemas/WalletTransactionItem'
        pageInfo:
          $ref: '#/components/schemas/PageMeta'
    WebauthnAuthenticationOptions:
      type: object
      required:
      - registered
      description: registered=false면 나머지 필드가 없다(전역 non_null)
      properties:
        registered:
          type: boolean
          description: 등록된 기기가 하나라도 있는가. false면 등록(webauthn_01·02)으로 분기
        challenge:
          type: string
          description: base64url 32바이트. 300초·1회용
        rpId:
          type: string
        allowCredentials:
          type: array
          items:
            $ref: '#/components/schemas/WebauthnCredentialDescriptor'
        timeout:
          type: integer
          description: 밀리초
        userVerification:
          type: string
          enum:
          - required
    WebauthnAuthenticationOptionsRequest:
      type: object
      additionalProperties: false
      required:
      - action
      - targetId
      properties:
        action:
          $ref: '#/components/schemas/StepUpAction'
        targetId:
          type: integer
          format: int64
          minimum: 1
          description: 대상 id(주문 그룹 또는 공연)
    WebauthnAuthenticationRequest:
      type: object
      additionalProperties: false
      required:
      - credentialId
      - clientDataJSON
      - authenticatorData
      - signature
      properties:
        credentialId:
          type: string
          description: base64url
        clientDataJSON:
          type: string
          description: base64url
        authenticatorData:
          type: string
          description: base64url
        signature:
          type: string
          description: base64url
        userHandle:
          type: string
          description: base64url. 선택
    WebauthnCredentialDescriptor:
      type: object
      required:
      - type
      - id
      properties:
        type:
          type: string
          enum:
          - public-key
        id:
          type: string
          description: credential ID (base64url)
        transports:
          type: array
          items:
            type: string
    WebauthnRegistrationOptions:
      type: object
      required:
      - challenge
      - rp
      - user
      - pubKeyCredParams
      - timeout
      - attestation
      - authenticatorSelection
      - excludeCredentials
      properties:
        challenge:
          type: string
          description: base64url 32바이트. 300초·1회용
        rp:
          type: object
          required:
          - id
          - name
          properties:
            id:
              type: string
              description: rpId = WEBAUTHN_RP_ID
            name:
              type: string
        user:
          type: object
          required:
          - id
          - name
          - displayName
          properties:
            id:
              type: string
              description: user handle(base64url) — memberId 8바이트 big-endian
            name:
              type: string
            displayName:
              type: string
        pubKeyCredParams:
          type: array
          items:
            type: object
            required:
            - type
            - alg
            properties:
              type:
                type: string
                enum:
                - public-key
              alg:
                type: integer
                description: COSE 알고리즘. -7 ES256 · -257 RS256
        timeout:
          type: integer
          description: 밀리초
        attestation:
          type: string
          enum:
          - none
        authenticatorSelection:
          type: object
          required:
          - authenticatorAttachment
          - residentKey
          - userVerification
          properties:
            authenticatorAttachment:
              type: string
              enum:
              - platform
            residentKey:
              type: string
              enum:
              - preferred
            userVerification:
              type: string
              enum:
              - required
        excludeCredentials:
          type: array
          items:
            $ref: '#/components/schemas/WebauthnCredentialDescriptor'
    WebauthnRegistrationRequest:
      type: object
      additionalProperties: false
      required:
      - credentialId
      - clientDataJSON
      - attestationObject
      properties:
        credentialId:
          type: string
          description: PublicKeyCredential.rawId (base64url)
        clientDataJSON:
          type: string
          description: base64url
        attestationObject:
          type: string
          description: base64url
        transports:
          type: array
          items:
            type: string
          description: getTransports() 결과
    WebauthnRegistrationResult:
      type: object
      required:
      - credentialId
      - registered
      - createdAt
      properties:
        credentialId:
          type: string
        registered:
          type: boolean
          enum:
          - true
        createdAt:
          type: string
          format: date-time
    WebauthnStepUpToken:
      type: object
      required:
      - stepUpToken
      - expiresAt
      properties:
        stepUpToken:
          type: string
          description: 32바이트 난수 base64url. 120초·1회용. 범위 = 회원 + 동작 + 대상(webauthn_03 본문)
        expiresAt:
          type: string
          format: date-time
  responses:
    Error:
      description: 실패 응답. `data`는 null. 코드 목록은 각 엔드포인트 description 참조.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            example:
              value:
                code: COMMON_VALIDATION_FAILED
                data: null
                msg: Invalid request.

    post:
      operationId: performance_12
      tags:
      - performance
      summary: 공연 취소(일괄 환불)
      description: '판매 중 취소 시 전 티켓을 수수료 없이 일괄 환불하고 컨트랙트에 halt(showId)를 걸어 이후 refund만 허용한다. 정산 잠금 이후에도 release 전까지는 가능하다. 환불은
        온체인 코인 이동뿐이며(에스크로 → 관객 지갑), 전 건 완료 후 운영자가 returnDeposit(showId)로 보증금을 생성팀 리더 지갑에 반환한다. 대량 작업이라 202 + jobId이며 건별 부분
        성공을 허용한다. release가 이미 실행된 공연은 취소할 수 없다. [2026-09-18 — S15P21B204-140] 판매 전(DRAFT·PENDING_AGREEMENT) 공연도 deposit_status=PAID면
        받는다. 보증금 50,000이 온체인 에스크로에 남는데 회수 경로가 이 엔드포인트뿐이기 때문이다. 그때 환불 대상은 0건이고 targetTicketCount=0·totalRefundAmount=0으로 halt
        → returnDeposit 두 tx만 나간다 — returnDeposit이 stage ∈ {RELEASED, HALTED}를 요구하므로(컨트랙트 인터페이스 v1 §4.1 11행) 판매 전에도 halt를
        건너뛸 수 없다. 보증금을 내지 않은 판매 전 공연은 되돌릴 돈이 없어 그대로 409다.

        '
      x-priority: P0
      x-role: 생성자
      x-screens:
      - P-10
      x-features:
      - F-performance-12
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: performanceId

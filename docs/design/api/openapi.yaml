        실패 시 failureReason·retryable을 채운다. signerType=USER인 job은 feeDelegated가 항상 true이고 retryable은 항상 false다(서버가 발신자 서명을
        다시 만들 수 없어 사용자가 다시 서명해야 한다). verification 블록으로 receipt 검증 결과(to·from·event·args)를 알려준다. 작업을 만든 회원 또는 ADMIN만 조회하며,
        남의 작업은 존재를 숨겨 COMMON_NOT_FOUND로 응답한다. 부분 성공이 있는 작업(공연 취소 일괄 환불, release)은 results 배열로 건별 상태를 함께 준다.

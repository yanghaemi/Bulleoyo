components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 회원 세션 access token(30분). refresh 14일은 Redis `auth:refresh:{jti}`. Web3Auth idToken 자체는 쓰지 않는다.
    entryToken:
      type: apiKey
      in: header
      name: X-Entry-Token
      description: 검표 링크 토큰(API-performance-10 발급, 해당 공연에만 유효). 쿼리 `entryToken`으로도 전달 가능.
  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema:
        type: string
        enum:
        - en
        - ko
        default: en
      description: msg·서명 요약·고지 문구 언어. 로그인 회원은 프로필 locale이 우선.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true

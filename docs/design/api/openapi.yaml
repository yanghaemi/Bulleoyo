        '409':
          $ref: '#/components/responses/Error'
          description: 'COMMON_CONFLICT — 같은 멱등키에 다른 본문, 이미 취소 처리 진행 중

            COMMON_CONFLICT — 정산 실행(release)이 진행 중이라 공연을 취소할 수 없음

            PERFORMANCE_INVALID_STATUS — 이미 CANCELLED, 또는 판매 전(DRAFT·PENDING_AGREEMENT)인데 deposit_status ≠ PAID [2026-09-18

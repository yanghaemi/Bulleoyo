        행을 만든다. effectiveFrom은 미래 시각도 허용하고 과거 시각은 기존 표시값을 소급 변경하므로 거부한다. 여러 pair를 한 번에 등록할 수 있고 부분 실패 없이 전량 롤백한다. 이 값이 자금
        계산에 쓰이지 않음을 usageNotice로 다시 명시한다. 감사 로그 action_type=RATE_CHANGE로 남긴다.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExchangeRateRegisterRequest'
            examples:
              default:
                value:
                  rates:
                  - pair: USD_KRW
                    rate: 1350.0
                    source: MANUAL
                  - pair: JPY_KRW
                    rate: 9.12
                    source: MANUAL
      responses:
        '200':
          description: 표시 환율 등록 성공
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/ExchangeRateRegisterResult'
              examples:
                default:
                  value:
                    code: SUCCESS
                    data:
                      registered:
                      - rateId: 56
                        pair: USD_KRW
                        rate: 1350.0
                        effectiveFrom: '2026-09-02T09:00:00+09:00'
                        source: MANUAL
                      - rateId: 57
                        pair: JPY_KRW
                        rate: 9.12
                        effectiveFrom: '2026-09-02T09:00:00+09:00'
                        source: MANUAL
                      publishedBy: 1
                      cacheInvalidated: true
                      usageNotice: 표시 환산에만 사용됩니다. 정산·분배·티켓 가격·지급 금액은 YoYo(=₩) 정수로 계산됩니다.
                    msg: 표시 환율이 등록되었습니다.

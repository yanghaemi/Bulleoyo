        기존 회원 여부를 확인할 수 있다. 기존 회원은 이 셋 없이 로그인하며 가입 폼을 다시 요구하지 않는다(회원 정보 변경은 member_06). 신규 회원이며 셋이 모두 null(생략)이면 AUTH_SIGNUP_REQUIRED(409)로
        가입 폼 입력을 요청하고 회원·세션을 만들지 않는다. 하나 이상 입력한 신규 요청의 나머지 필드 누락, false 동의 또는 형식 위반은 COMMON_VALIDATION_FAILED(400)다. 유효한 countryCode와

        준다. kind=APPROVE면 allowance 확인만 하고, kind=PURCHASE의 receipt가 확정될 때 결제가 성립한다. §0.4 signed-tx 단계의 대표 사례다. [v6.2] kind=PURCHASE는
        본문의 orderId로 어느 하위 주문의 서명인지 지정한다(필수). 서버는 calldata에서 디코드한 orderRef가 그 하위 주문의 order_ref와 같은지 대조하고, 다르면 PAYMENT_AMOUNT_MISMATCH로
        거부한다. kind=APPROVE는 그룹 대표 주문에 귀속되므로 orderId를 생략할 수 있다. 상태 전이: PURCHASE 보고 즉시 그 하위 주문의 payment AWAITING_SIGNATURE →
        PAYING, receipt 확정 시 PAID + 그 하위 주문 PAID + 티켓 ISSUED 발급. 다른 하위 주문의 상태는 영향받지 않는다(부분 실패 정책). tx가 revert되면(재고 소진·판매 잠금·allowance
        부족) 그 하위 주문의 payment는 FAILED가 되지만 주문은 PENDING_PAYMENT로 남아 재시도할 수 있다(15분 만료까지). 이미 PAID가 된 다른 하위 주문은 되돌리지 않는다. 같은 senderSignedRlp의
        진행 중·확정 job은 최초 jobId를 재생하고, 종단 FAILED job은 실패 이력을 보존한 채 새 job으로 다시 제출한다.'
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: X-Step-Up-Token
        in: header
        required: false
        schema:
          type: string
          maxLength: 128
        description: '[2026-09-24] 결제 전 본인 확인 토큰(webauthn_04). 서버 스위치 STEP_UP_ENABLED 가 켜져 있으면 필수(abandoned=true 제외) — 없거나
          만료·소비·다른 동작·다른 주문 그룹·다른 회원의 토큰이면 403 WEBAUTHN_STEP_UP_REQUIRED. 토큰 범위는 PAYMENT·주문 그룹(webauthn_03 본문). 첫 보고가 토큰을
          소비해 범위에 묶고(120초) 같은 그룹의 이어지는 보고는 같은 토큰으로 통과한다. 꺼져 있으면 읽지 않는다'
      - name: orderId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: 주문 PK. v6.2 — 그룹의 어느 하위 주문이든 허용(실제 대상은 본문 orderId)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentSignedTxRequest'
            examples:
              default:
                value:
                  kind: PURCHASE
                  senderSignedRlp: '0x31f8c2a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f607182934a5b6c'
                  orderId: 5502
              abandoned:
                value:
                  kind: PURCHASE
                  senderSignedRlp: '0x31f8c2a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f607182934a5b6c'
                  orderId: 5502
                  abandoned: true
      responses:
        '202':
          description: '대납 서명·전송 접수. receipt 검증(§0.4) 후 CONFIRMED 시 payment=PAID, 티켓이 발권된다. [2026-09-16 — S15P21B204-92] 공용
            ChainJobAccepted 를 참조하던 것을 PaymentSignedTxResponse 실제 12필드로 바꿨다. txHash 는 서버가 대납 서명 후 전송해서 얻은 해시이며 클라이언트가 보고한
            값이 아니다.

            '
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      required:
                      - jobId
                      - status
                      - signerType
                      - feeDelegated
                      - pollAfterMs
                      - orderId
                      - orderGroupId
                      - paymentId
                      - kind
                      - paymentStatus
                      - expectedEvent
                      - pendingOrderIds
                      properties:
                        jobId:
                          type: string
                        status:
                          type: string
                          enum:
                          - PENDING
                          - SUBMITTED
                          - CONFIRMED
                          - FAILED
                        signerType:
                          type: string
                          enum:
                          - OPERATOR
                          - USER
                        feeDelegated:
                          type: boolean
                        pollAfterMs:
                          type: integer
                          default: 1200
                        orderId:
                          type: integer
                          format: int64
                          description: '[v6.2] 이 서명이 속한 하위 주문 id'
                        orderGroupId:
                          type: integer
                          format: int64
                          description: '[v6.2] 그룹 대표 주문 id'
                        paymentId:
                          type: integer
                          format: int64
                        kind:
                          type: string
                          enum:
                          - APPROVE
                          - PURCHASE
                        paymentStatus:
                          type: string
                          enum:
                          - REQUESTED
                          - AWAITING_SIGNATURE
                          - PAYING
                          - PAID
                          - FAILED
                          - REFUNDED
                          description: 보고 직후의 payment 상태. PURCHASE 보고면 PAYING 이다.
                        txHash:
                          allOf:
                          - $ref: '#/components/schemas/TxHash'
                          description: 전송 전이면 키가 없다(non_null 직렬화).
                        explorerUrl:
                          type: string
                          format: uri
                          description: txHash 가 없으면 이 키도 없다.
                        expectedEvent:
                          type: string
                          enum:
                          - Approval
                          - Purchased
                          description: receipt 에서 확인할 이벤트 이름. status 만 보지 않는다.
                        pendingOrderIds:
                          type: array
                          items:
                            type: integer
                            format: int64
                          description: '[v6.2] 그룹에서 아직 결제가 확정되지 않은 하위 주문 목록. 빈 배열이면 이 보고로 그룹이 완결됨'
              examples:
                default:
                  value:
                    code: SUCCESS
                    data:
                      jobId: chain_01J9GC5D6F
                      status: SUBMITTED
                      signerType: USER
                      feeDelegated: true
                      pollAfterMs: 1200
                      orderId: 5502
                      orderGroupId: 5501
                      paymentId: 8802
                      kind: PURCHASE
                      paymentStatus: PAYING
                      txHash: '0x5b6c7d8e9f0a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f607182934a'
                      explorerUrl: https://kairos.kaiascan.io/tx/0x5b6c7d8e9f0a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f607182934a
                      expectedEvent: Purchased
                      pendingOrderIds:
                      - 5501
                    msg: 결제를 확인하고 있습니다.
        '200':
          description: '서명 취소 보고(abandoned: true) — payment는 AWAITING_SIGNATURE 유지, 잔액은 그대로 남는다'
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        orderId:
                          type: integer
                          format: int64
                        orderGroupId:
                          type: integer
                          format: int64
                        paymentId:
                          type: integer
                          format: int64
                        paymentStatus:
                          type: string
                          enum:
                          - AWAITING_SIGNATURE
                        orderStatus:
                          type: string
                          enum:
                          - PENDING_PAYMENT
                        balanceKept:
                          type: boolean
                        expiresAt:
                          type: string
                          format: date-time
              examples:
                default:
                  value:
                    code: SUCCESS
                    data:
                      orderId: 5502
                      orderGroupId: 5501
                      paymentId: 8802
                      paymentStatus: AWAITING_SIGNATURE
                      orderStatus: PENDING_PAYMENT
                      balanceKept: true
                      expiresAt: '2026-09-10T20:15:00+09:00'
                    msg: 결제가 완료되지 않았습니다. 잔액은 그대로 남아 있습니다.
        '400':
          $ref: '#/components/responses/Error'
          description: 'COMMON_VALIDATION_FAILED — [v5] RLP 형식 위반·디코드 실패, 허용되지 않는 kind, abandoned=false인데 senderSignedRlp
            누락, [v6.2] kind=PURCHASE인데 orderId 누락

            '
        '401':
          $ref: '#/components/responses/Error'
          description: COMMON_UNAUTHORIZED — 비로그인
        '403':
          $ref: '#/components/responses/Error'
          description: WEBAUTHN_STEP_UP_REQUIRED — [2026-09-24] 스위치 켜짐 + X-Step-Up-Token 없음·만료·이미 소비·다른 동작·다른 주문 그룹·다른 회원의
            토큰
        '404':
          $ref: '#/components/responses/Error'
          description: COMMON_NOT_FOUND — 존재하지 않는 주문, 타인 주문, 결제 시작 이력 없음(순서 위반), [v6.2] orderId가 이 그룹의 하위 주문이 아님
        '409':
          $ref: '#/components/responses/Error'
          description: 'PAYMENT_ALREADY_PAID — 이미 PAID인 하위 주문

            COMMON_CONFLICT — 주문 만료(15분 경과), 같은 RLP가 다른 주문으로 보고됨(서명 거부 전용 코드 PAYMENT_SIGNATURE_REJECTED는 §16.1)

            PAYMENT_AMOUNT_MISMATCH — [v5] RLP 발신자·to·data 불일치 또는 receipt·Purchased 이벤트 검증 실패(9개 항목 중 하나), [v6.2] calldata
            orderRef가 지정한 orderId와 다름(전용 코드 PAYMENT_TX_MISMATCH는 §16.1)

            TICKET_SOLD_OUT — tx가 재고 부족으로 revert됨(컨트랙트·재고 대사 결과)

            TICKET_SALE_CLOSED — tx가 판매 잠금(ON_SALE 아님)으로 revert됨

            '
        '500':
          $ref: '#/components/responses/Error'
          description: CHAIN_GAS_INSUFFICIENT — [v5] 운영지갑(fee payer) 잔액 부족으로 대납 전송 불가 — 운영자 알림 대상
        '504':
          $ref: '#/components/responses/Error'
          description: CHAIN_TX_TIMEOUT — 확정이 120초를 넘김 — jobId로 계속 폴링
  /api/v1/coin/supply:
    get:
      operationId: coin_01
      tags:
      - coin
      x-priority: P0
      x-screens:
      - V-02
      x-features:
      - F-coin-02
      - F-verify-02
      x-role: GUEST
      summary: YoYo 발행량·에스크로 공시
      description: '발행량 요약(총 발행량·에스크로·지갑 보유 합계·지급 건수)과 불변식 4개 대사 결과를 한 응답으로 준다. [v5] v4의 유통량 요약(구 API-coin-01)과 상세 공시(구 API-verify-02)가
        통합된 공개 API다. 1분 캐시. 불변식 1 또는 4가 깨지면 supplyMatched: false와 함께 mint·release를 중단(mintHalted·releaseHalted)하고, 불변식 3(정산
        재계산)이 깨지면 releaseHalted만 true가 되며, 운영자 알림을 보내되, 조회 자체는 200으로 성공시킨다. 관객 화면에는 노출하지 않는 발행 주체 라벨과 고지 문구(disclosure)를 Accept-Language에
        맞춰 함께 내린다.'
      security: []
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: 발행량·에스크로 공시 조회 성공
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/CoinSupply'
              examples:
                default:
                  value:
                    code: SUCCESS
                    data:
                      totalSupply: 5290000
                      escrowTotal: 1275000
                      walletTotal: 4015000
                      grantCount: 53
                      supplyMatched: true
                      currency: KRW
                      display:
                        currency: USD
                        approx: 3918.52
                        rate: 1350.0
                        asOf: '2026-09-02T09:00:00+09:00'
                      issuer:
                        type: MOCK
                        label: Platform (demo grant)
                        replaceable: true
                      mintHalted: false
                      releaseHalted: false
                      network: kaia-kairos
                      chainId: 1001
                      tokenAddress: '0x5f1e2d3c4b5a69788796a5b4c3d2e1f009182736'
                      tokenSymbol: YoYo
                      tokenDecimals: 0
                      explorerUrl: https://kairos.kaiascan.io/address/0x5f1e2d3c4b5a69788796a5b4c3d2e1f009182736
                      invariants:
                      - 'no': 1
                        name: SUPPLY_EQUALS_MINTED
                        expected: 5290000
                        actual: 5290000
                        matched: true
                        note: totalSupply = Σ Minted — mint 만 있어 발행량은 줄지 않는다
                      - 'no': 2
                        name: ESCROW_PER_SHOW
                        checkedShows: 2
                        mismatchedShows: 0
                        matched: true
                        note: 공연별 escrowOf = Σpurchase − Σrefund − Σrelease (보증금 별도)
                      - 'no': 3
                        name: RELEASED_EQUALS_RULE_RECALC
                        checkedShows: 1
                        maxDiff: 0
                        matched: true
                        note: Σ Released = 잠긴 규칙 × 카운터 재계산(dust 포함, 1원 오차 없음); 온체인 choiceCountsOf 카운터로 평가 1건
                      - 'no': 4
                        name: SUPPLY_EQUALS_WALLETS_PLUS_ESCROW
                        expected: 5290000
                        actual: 5290000
                        matched: true
                        note: totalSupply = Σ등록 지갑 잔액 + Σ에스크로·보증금 — 정확히 일치 (등록 지갑 3개 노드 조회)
                      perPerformanceEscrow:
                      - performanceId: 12
                        escrowAmount: 1225000
                        depositAmount: 50000
                      - performanceId: 14
                        escrowAmount: 0
                        depositAmount: 0
                      asOf: '2026-09-22T18:12:00+09:00'
                      nextRefreshAt: '2026-09-22T18:13:00+09:00'
                      stale: false
                      disclosure: A testnet demo set in a future where money is a coin. No real assets or currency. Coins
                        are granted by the platform for the demo; balance figures are read through the platform server.
                      grantNotice: 'Every coin in circulation came from a demo grant: 100,000 on sign-up, plus manual admin
                        grants.'
                    msg: ''
        '429':
          $ref: '#/components/responses/Error'
          description: COMMON_TOO_MANY_REQUESTS — 호출 한도 초과
        '502':
          $ref: '#/components/responses/Error'
          description: COMMON_EXTERNAL_SERVICE_ERROR — 체인 조회 실패하고 캐시도 없음
  /api/v1/coin/rates:
    get:
      operationId: coin_02
      tags:
      - coin
      x-priority: P0
      x-screens:
      - 공통
      x-features:
      - F-coin-06
      x-role: GUEST
      summary: 표시 환율 조회
      description: 현재 유효한 표시 환율을 pair별로 준다. 표시 전용이며 결제·정산·컨트랙트 계산에는 쓰이지 않는다(usageNotice로 명시). 1 base = rate KRW 방향이다. pair
        쿼리로 하나만 조회할 수 있고 미지정 시 등록된 전부를 준다. 1분 캐시. 등록된 환율이 없으면 빈 배열을 준다(404가 아니다) — 환율 미등록은 오류가 아니다.
      security: []
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: pair
        in: query
        required: false
        schema:
          type: string
          pattern: ^[A-Z]{3}_KRW$
        description: '예: USD_KRW·JPY_KRW·EUR_KRW. 미지정 시 전체'
      responses:
        '200':
          description: 표시 환율 목록 조회 성공
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        rates:
                          type: array
                          items:
                            $ref: '#/components/schemas/ExchangeRate'
                        usageNotice:
                          type: string
                        refreshedAt:
                          type: string
                          format: date-time
              examples:
                default:
                  value:
                    code: SUCCESS
                    data:
                      rates:
                      - pair: USD_KRW
                        base: USD
                        quote: KRW
                        rate: 1350.0
                        effectiveFrom: '2026-09-02T09:00:00+09:00'
                        source: MANUAL
                      - pair: JPY_KRW
                        base: JPY
                        quote: KRW
                        rate: 9.12
                        effectiveFrom: '2026-09-02T09:00:00+09:00'
                        source: MANUAL
                      - pair: EUR_KRW
                        base: EUR
                        quote: KRW
                        rate: 1462.5
                        effectiveFrom: '2026-09-02T09:00:00+09:00'
                        source: MANUAL
                      usageNotice: Rates are for display only. All payments, refunds and settlements are calculated in Korean
                        won.
                      refreshedAt: '2026-09-02T14:00:00+09:00'
                    msg: ''
        '400':
          $ref: '#/components/responses/Error'
          description: COMMON_VALIDATION_FAILED — pair 형식 위반({3자}_{3자} 아님)
        '429':
          $ref: '#/components/responses/Error'
          description: COMMON_TOO_MANY_REQUESTS — 호출 한도 초과
  /api/v1/admin/coin/rates:
    put:
      operationId: coin_03
      tags:
      - coin
      x-priority: P0
      x-screens:
      - M-03
      x-features:
      - F-coin-07

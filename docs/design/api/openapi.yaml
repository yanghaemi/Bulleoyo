          description: 'PERFORMANCE_NOT_OWNER — 생성자 팀 리더가 아님

            '
        '404':
          $ref: '#/components/responses/Error'
          description: 'PERFORMANCE_NOT_FOUND — 존재하지 않는 performanceId


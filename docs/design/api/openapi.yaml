                  reason: 공연장 사정으로 부득이하게 취소되었습니다.
      responses:
        '202':
          description: '운영자 tx(halt → 건별 refund → returnDeposit) 접수. §0.3 비동기 트랜잭션 규약을 따르며 jobId로 GET /api/v1/chain/jobs/{jobId}를
            폴링한다. [2026-09-16 — S15P21B204-92] 공용 ChainJobAccepted(jobId/status/pollAfterMs) 를 참조하던 것을 CancelPerformanceResponse
            실제 9필드로 바꿨다.

            '
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      required:
                      - jobId
                      - status
                      - pollAfterMs
                      - performanceId
                      - targetTicketCount
                      - totalRefundAmount
                      - currency
                      - depositReturnPlanned
                      properties:
                        jobId:
                          type: string
                          description: HALT job. 이 흐름의 대표 job 이다
                        status:
                          type: string
                          enum:
                          - PENDING
                          - SUBMITTED
                          - CONFIRMED
                          - FAILED
                        pollAfterMs:
                          type: integer
                          default: 2000
                        performanceId:
                          type: integer
                          format: int64
                        targetTicketCount:
                          type: integer
                        totalRefundAmount:
                          $ref: '#/components/schemas/Money'
                        currency:
                          type: string
                          enum:
                          - KRW
                        depositReturnPlanned:
                          type: boolean
                        depositAmount:
                          allOf:
                          - $ref: '#/components/schemas/Money'
                          description: '보증금이 없는 공연이면 서버가 null 을 담고 전역 non_null 직렬화가 키를 지운다. 그래서 required 가 아니다 — 0 과 구분해야
                            한다.

                            '
              examples:
                default:

  /api/v1/performances/{performanceId}/settlement/aggregate:
    post:
      operationId: settlement_02
      tags:
      - settlement
      summary: 정산 집계 확정
      description: '공연 종료(ENDED) 이후 생성자 또는 ADMIN이 실행한다. 서버 집계와 온체인 선택 카운터 합을 대조해 불일치하면 SETTLEMENT_AGGREGATE_MISMATCH(409)로
        집계 확정만 거부하고 정산 상태는 그대로 둔다 — HALTED로 전이하는 경로가 아니다. 확정 서명이 끝나지 않은 결제·mint가 남아 있으면 COIN_MINT_PENDING으로 막는다 — PAYING 결제는
        주문 상태와 무관하게 세고(대납 tx 가 이미 나갔다), 미서명 결제는 살아 있는 (PENDING_PAYMENT) 주문의 것만 센다. 확정되면 정산이 NONE → AGGREGATED로 전이하고 팀별 분배액이
        산출·저장된다.

        '
      x-priority: P0
      x-role:
      - PERFORMER
      - ADMIN
      x-screens:
      - P-08
      x-features:
      - F-settlement-02
      security:
      - bearerAuth: []
      parameters:
      - name: performanceId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: 공연 PK
      responses:
        '202':
          description: '집계 확정 접수(운영자 tx, signerType=OPERATOR). 확정 시 정산 NONE → AGGREGATED, settlement_share가 확정 저장된다. [2026-09-16
            — S15P21B204-92] 공용 ChainJobAccepted 를 참조하던 것을 AggregateResponse 실제 7필드로 바꿨다. 전부 필수다 — null 이 될 수 있는 자리가 없다.

            '
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      required:
                      - jobId
                      - status
                      - signerType
                      - pollAfterMs
                      - performanceId
                      - nextStatus
                      - validTicketCount
                      properties:
                        jobId:
                          type: string
                        status:
                          type: string
                          enum:
                          - PENDING
                          - SUBMITTED
                          - CONFIRMED
                          - FAILED
                        signerType:
                          type: string
                          enum:
                          - OPERATOR
                          - USER
                        pollAfterMs:
                          type: integer
                          default: 2000
                        performanceId:
                          type: integer
                          format: int64
                        nextStatus:
                          type: string
                          enum:
                          - AGGREGATED
                          description: 확정 시 정산 상태
                        validTicketCount:
                          type: integer
                          description: 환불을 뺀 유효 티켓 수. 온체인 카운터와 대조가 끝난 값이다
              examples:
                default:
                  value:
                    code: SUCCESS
                    data:
                      jobId: chain_01J9E1K2L3
                      status: PENDING
                      signerType: OPERATOR
                      pollAfterMs: 2000
                      performanceId: 12
                      nextStatus: AGGREGATED
                      validTicketCount: 64
                    msg: 집계 확정을 접수했습니다.
        '403':
          $ref: '#/components/responses/Error'
          description: 'PERFORMANCE_NOT_OWNER — 생성자도 ADMIN도 아님

            '
        '404':
          $ref: '#/components/responses/Error'
          description: 'PERFORMANCE_NOT_FOUND — 존재하지 않는 performanceId

            '
        '409':
          $ref: '#/components/responses/Error'
          description: 'PERFORMANCE_INVALID_STATUS — 공연이 아직 ENDED가 아니거나 CANCELLED이거나, 정산이 HALTED

            COMMON_CONFLICT — 이미 AGGREGATED 이상이거나 집계 작업 진행 중

            COIN_MINT_PENDING — 확정되지 않은 결제 서명·mint 건이 남아 있음 (PAYING 은 주문 상태와 무관하게, 미서명 결제는 살아 있는 PENDING_PAYMENT 주문의 것만 센다)

            SETTLEMENT_AGGREGATE_MISMATCH — 온체인 카운터 합 ≠ 서버 집계

            '
        '500':
          $ref: '#/components/responses/Error'
          description: 'CHAIN_GAS_INSUFFICIENT — 운영지갑 가스 부족

            '
        '504':
          $ref: '#/components/responses/Error'
          description: 'CHAIN_TX_TIMEOUT — 온체인 확정 지연 — jobId로 계속 폴링

            '

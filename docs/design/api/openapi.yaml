        재호출한다. qr_secret은 티켓 발급 시 1회 생성되고 이후 재생성 경로가 없다. USED·CANCELLED에는 발급하지 않는다. QR·입장은 온체인과 무관하다 — 티켓의 유효성은 DB 소유권과 서명
        QR이 정한다. [2026-09-16 — S15P21B204-101] QR 이미지의 페이로드는 qrToken 문자열 그대로다(포장·접두 없음). 검표(S-02)는 읽은 문자열을 entry_01의 qrToken에
        그대로 넣고, performanceId는 QR이 아니라 검표 진입 URL /entry/{performanceId}에서 가져온다. 검표 링크의 ?token=(STAFF 기기 인증, performance_10이
        발급)과는 다른 토큰이다.

        + 도메인 바인딩을 포함하며 5분 유효· 1회용이다. 챌린지는 테이블이 아닌 Redis wallet:challenge:{memberId}(TTL 300초)에 저장하고 같은 회원이 재호출하면 이전 챌린지를
        덮어써 무효화한다. 이미 지갑이 LINKED인 회원은 막는다. 검증· 등록은 POST /api/v1/wallets(wallet_04)가 이어받는다.'

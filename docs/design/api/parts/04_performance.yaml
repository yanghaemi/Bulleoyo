# 2026-09-08: 코인 개명 KRWS -> YoYo (name·symbol "YoYo", 로직 불변)
paths:
  /api/v1/performances:
    post:
      operationId: performance_01
      tags: [performance]
      summary: 공연 생성
      description: >
        팀 리더가 공연 기본 정보(제목·소개·일시·장소)와 단독/공동 여부를 등록한다. 생성자 팀은 자동으로 참여팀 1번이 되고,
        생성 직후 상태는 DRAFT·보증금 상태는 UNPAID다. 취소 마감(D-3 00:00)·판매 마감(공연 시작 1분 전)은 서버가
        startAt에서 자동 계산해 응답으로만 내려주며, 생성 시점에 리더 지갑 연결(LINKED)을 확인한다.
        생성과 동시에 검표 페이지 링크(서명 토큰)가 자동 발급된다.
      x-priority: P0
      x-role: 리더
      x-screens: [P-03]
      x-features: [F-performance-01]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PerformanceCreateRequest'
            examples:
              default:
                value:
                  hostTeamId: 7
                  title: 합정 3밴드 합동공연
                  description: 인디록 3팀 합동 무대
                  posterUploadId: 3f2b7c41-9a5e-4c8d-b2a1-70e6d9c4f815
                  ticketArtworkUploadId: 8c1d5e60-2f7a-4b93-ae14-6d0b3c9f7a25
                  venueName: 합정 언플러그드
                  venueAddress: 서울 마포구 양화로 000
                  startAt: '2026-09-19T19:00:00+09:00'
                  endAt: '2026-09-19T22:00:00+09:00'
                  jointPerformance: true
      responses:
        '201':
          description: 공연이 DRAFT 상태로 생성됨
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PerformanceCreated'
              examples:
                default:
                  value:
                    code: SUCCESS
                    data:
                      performanceId: 12
                      title: 합정 3밴드 합동공연
                      status: DRAFT
                      hostTeamId: 7
                      startAt: '2026-09-19T19:00:00+09:00'
                      endAt: '2026-09-19T22:00:00+09:00'
                      saleCloseAt: '2026-09-19T18:00:00+09:00'
                      cancelDeadlineAt: '2026-09-16T00:00:00+09:00'
                      deposit:
                        status: UNPAID
                        amount: 50000
                        currency: KRW
                        display: { currency: USD, approx: 37.04, rate: 1350.0, asOf: '2026-09-02T09:00:00+09:00' }
                        leaderBalance: 120000
                        sufficient: true
                      nextAction: PAY_DEPOSIT
                    msg: 공연이 생성되었습니다. 보증금을 납부해 주세요.
        '400':
          $ref: '#/components/responses/Error'
          description: |
            COMMON_VALIDATION_FAILED — 형식 위반, saleCloseAt·cancelDeadlineAt·depositAmount 전달(서버 결정 필드)
            PERFORMANCE_DATE_INVALID — 과거 일시, endAt ≤ startAt
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
          description: |
            COMMON_FORBIDDEN — hostTeamId 팀의 리더가 아님
        '404':
          $ref: '#/components/responses/Error'
          description: |
            TEAM_NOT_FOUND — 존재하지 않는 hostTeamId
            WALLET_NOT_FOUND — 리더 지갑 미연결
    get:
      operationId: performance_02
      tags: [performance]
      summary: 공연 목록(공개)
      description: >
        비로그인 방문자도 볼 수 있는 공개 목록이다. ON_SALE·SALE_CLOSED 공연만 노출하며 검색어(제목·팀명)·날짜 범위로
        필터한다. 기본 정렬은 공연 시작 일시 오름차순이고, 금액은 §0.5 축약형(data.rate + 항목 minPriceAmount)으로
        내려간다. 목록 응답은 30초 캐시하며 환율이 바뀌면 캐시를 무효화한다.
      x-priority: P0
      x-role: GUEST
      x-screens: [A-01, A-15]
      x-features: [F-performance-02]
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: keyword
          in: query
          required: false
          schema: { type: string, maxLength: 50 }
          description: 제목·참여팀명 부분 일치
        - name: fromDate
          in: query
          required: false
          schema: { type: string, format: date }
        - name: toDate
          in: query
          required: false
          schema: { type: string, format: date }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [ON_SALE, SALE_CLOSED] }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: sort
          in: query
          required: false
          schema: { type: string, enum: ['startAt,asc', 'startAt,desc', 'createdAt,desc'], default: 'startAt,asc' }
      responses:
        '200':
          description: 공개 공연 목록
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PerformanceListResponseData'
              examples:
                default:
                  value:
                    code: SUCCESS
                    data:
                      rate: { currency: USD, rate: 1350.0, asOf: '2026-09-02T09:00:00+09:00' }
                      items:
                        - performanceId: 12
                          title: 합정 3밴드 합동공연
                          posterImageUrl: https://j15b204.p.ssafy.io/uploads/p/202609/3a9c1f80-52db-4b2e-9f71-0c6d8a4e2b13.png
                          ticketImageUrl: https://j15b204.p.ssafy.io/uploads/p/202609/7b2e4c11-9d38-4a6f-8c05-1e9a7f3d6b40.png
                          venueName: 합정 언플러그드
                          startAt: '2026-09-19T19:00:00+09:00'
                          status: ON_SALE
                          minPriceAmount: 25000
                          currency: KRW
                          soldOut: false
                          teamNames: [블루노트, 새벽세시, 노이즈캔슬]
                      pageInfo: { page: 0, size: 20, totalElements: 37, hasNext: true }
                    msg: ''
        '400':
          $ref: '#/components/responses/Error'
          description: |
            COMMON_VALIDATION_FAILED — size 100 초과, 날짜 역전, 허용되지 않는 status·sort
        '429':
          $ref: '#/components/responses/Error'

  /api/v1/performances/me:
    get:
      operationId: performance_06
      tags: [performance]
      summary: 내 팀 참여 공연 목록
      description: >
        로그인 회원이 리더인 팀이 주최하거나 참여 중인 공연을 DRAFT부터 CANCELLED까지 전부 준다. 각 행에
        depositStatus·myTeamAgreementStatus(PENDING/SIGNING/AGREED)·pendingSignature(DEPOSIT/AGREE/TREASURY_IN 또는 null)를
        담아 대시보드가 "지금 서명할 일"을 뽑게 한다. 초대받았지만 미수락인 공연은 participationStatus=INVITED로 함께 준다.
        myTeamSettlementApproved(선택)는 내 팀의 정산 조기 동의(API-settlement-08) 여부이며, 정산 행이나 내 팀 몫이
        아직 없으면 생략한다. 팀 단위 동의는 myParticipatingTeams[].settlementApproved다.
      x-priority: P0
      x-role: PERFORMER
      x-screens: [P-01]
      x-features: [F-performance-06]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [DRAFT, PENDING_AGREEMENT, ON_SALE, SALE_CLOSED, ENDED, CANCELLED] }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: sort
          in: query
          required: false
          schema: { type: string, enum: ['startAt,desc', 'startAt,asc'], default: 'startAt,desc' }
      responses:
        '200':
          description: 내 팀 참여 공연 목록
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MyPerformanceListResponseData'
              examples:
                default:
                  value:
                    code: SUCCESS
                    data:
                      items:
                        - performanceId: 12
                          title: 합정 3밴드 합동공연
                          startAt: '2026-09-19T19:00:00+09:00'
                          status: PENDING_AGREEMENT
                          settlementStatus: NONE
                          depositStatus: PAID
                          teamId: 7
                          host: true
                          participationStatus: ACCEPTED
                          myTeamAgreementStatus: PENDING
                          pendingSignature: AGREE
                          myParticipatingTeams:
                            - teamId: 7
                              teamName: 블루노트
                              host: true
                              participationStatus: ACCEPTED
                              agreementStatus: PENDING
                              pendingSignature: AGREE
                        - performanceId: 9
                          title: 망원 어쿠스틱 나이트
                          startAt: '2026-09-12T19:00:00+09:00'
                          status: ENDED
                          settlementStatus: LOCKED
                          depositStatus: RETURNED
                          teamId: 7
                          host: false
                          participationStatus: ACCEPTED
                          myTeamAgreementStatus: AGREED
                          myTeamSettlementApproved: false
                          myParticipatingTeams:
                            - teamId: 7
                              teamName: 블루노트
                              host: false
                              participationStatus: ACCEPTED
                              agreementStatus: AGREED
                              settlementApproved: false
                      pageInfo: { page: 0, size: 20, totalElements: 4, hasNext: false }
                    msg: ''
        '400':
          $ref: '#/components/responses/Error'
          description: |
            COMMON_VALIDATION_FAILED — 허용되지 않는 status·sort, size 100 초과
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
          description: |
            COMMON_FORBIDDEN — 리더인 팀이 없는 계정(PERFORMER 아님)

  /api/v1/performances/{performanceId}:
    get:
      operationId: performance_03
      tags: [performance]
      summary: 공연 상세(공개)
      description: >
        출연팀·일시·장소·티켓 옵션(잔여 수량)과 공개 검증 페이지 링크를 준다. 가격은 원 값 + display 환산을 함께
        담고, 지갑 주소·해시·컨트랙트 용어는 담지 않는다(참여팀 지갑 주소는 API-verify-01에서만 제공). 취소 마감 시각과
        환불 고지(refundPolicyNotice)를 함께 내려준다. DRAFT·PENDING_AGREEMENT 공연은 생성자·참여팀 리더에게만
        보이고 그 외에는 PERFORMANCE_NOT_FOUND로 존재를 숨긴다.
      x-priority: P0
      x-role: GUEST
      x-screens: [A-02]
      x-features: [F-performance-03]
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: performanceId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 공연 상세
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PerformanceDetail'
              examples:
                default:
                  value:
                    code: SUCCESS
                    data:
                      performanceId: 12
                      title: 합정 3밴드 합동공연
                      description: 인디록 3팀 합동 무대
                      posterImageUrl: https://j15b204.p.ssafy.io/uploads/p/202609/3a9c1f80-52db-4b2e-9f71-0c6d8a4e2b13.png
                      ticketImageUrl: https://j15b204.p.ssafy.io/uploads/p/202609/7b2e4c11-9d38-4a6f-8c05-1e9a7f3d6b40.png
                      venueName: 합정 언플러그드
                      venueAddress: 서울 마포구 양화로 000
                      startAt: '2026-09-19T19:00:00+09:00'
                      endAt: '2026-09-19T22:00:00+09:00'
                      saleCloseAt: '2026-09-19T18:00:00+09:00'
                      cancelDeadlineAt: '2026-09-16T00:00:00+09:00'
                      status: ON_SALE
                      jointPerformance: true
                      purchaseLimitPerMember: 4
                      rate: { currency: USD, rate: 1350.0, asOf: '2026-09-02T09:00:00+09:00' }
                      participants:
                        - { teamId: 7, teamName: 블루노트, host: true }
                        - { teamId: 9, teamName: 새벽세시, host: false }
                        - { teamId: 11, teamName: 노이즈캔슬, host: false }
                      ticketTypes:
                        - ticketTypeId: 31
                          name: 일반
                          price: { amount: 25000, currency: KRW, display: { currency: USD, approx: 18.52, rate: 1350.0, asOf: '2026-09-02T09:00:00+09:00' } }
                          totalQuantity: 80
                          remainingQuantity: 41
                        - ticketTypeId: 32
                          name: 응원
                          price: { amount: 35000, currency: KRW, display: { currency: USD, approx: 25.93, rate: 1350.0, asOf: '2026-09-02T09:00:00+09:00' } }
                          totalQuantity: 20
                          remainingQuantity: 12
                      refundPolicyNotice: Refunds are returned to your balance in Korean won.
                      verificationUrl: https://b204.ssafy.io/verify/12
                    msg: ''
        '404':
          $ref: '#/components/responses/Error'
          description: |
            PERFORMANCE_NOT_FOUND — 존재하지 않거나 비공개 상태를 비관계자가 조회
    patch:
      operationId: performance_04
      tags: [performance]
      summary: 공연 수정(잠금 전)
      description: >
        DRAFT·PENDING_AGREEMENT에서만 수정 가능하며 ON_SALE 이후는 PERFORMANCE_ALREADY_ON_SALE이다. 생성자 팀
        리더만 수정한다. 일시를 바꾸면 cancelDeadlineAt·saleCloseAt을 재계산하고, 규칙이 이미 설정된 상태에서
        일시·공동 여부를 바꾸면 기존 팀별 동의를 전부 PENDING으로 초기화하며 진행 중 SIGNING job은 FAILED로 닫는다.
        이미 납부된 보증금(deposit_status=PAID)은 초기화 대상이 아니다.
      x-priority: P0
      x-role: 생성자
      x-screens: [P-03]
      x-features: [F-performance-04]
      security:
        - bearerAuth: []
      parameters:
        - name: performanceId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PerformanceUpdateRequest'
            examples:
              default:
                value:
                  venueName: 합정 언플러그드 B홀
                  startAt: '2026-09-19T19:30:00+09:00'
                  endAt: '2026-09-19T22:30:00+09:00'
      responses:
        '200':
          description: 수정 완료
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PerformanceUpdated'
              examples:
                default:
                  value:
                    code: SUCCESS
                    data:
                      performanceId: 12
                      status: PENDING_AGREEMENT
                      startAt: '2026-09-19T19:30:00+09:00'
                      saleCloseAt: '2026-09-19T18:30:00+09:00'
                      cancelDeadlineAt: '2026-09-16T00:00:00+09:00'
                      agreementsReset: true
                      depositStatus: PAID
                    msg: 공연 정보가 수정되었습니다. 참여팀 동의를 다시 받아야 합니다.
        '400':
          $ref: '#/components/responses/Error'
          description: |
            COMMON_VALIDATION_FAILED — 형식 위반
            PERFORMANCE_DATE_INVALID — 과거 일시, 일시 역전
        '403':
          $ref: '#/components/responses/Error'
          description: |
            PERFORMANCE_NOT_OWNER — 생성자 팀 리더가 아님
        '404':
          $ref: '#/components/responses/Error'
          description: |
            PERFORMANCE_NOT_FOUND — 존재하지 않는 performanceId
        '409':
          $ref: '#/components/responses/Error'
          description: |
            PERFORMANCE_ALREADY_ON_SALE — 상태가 ON_SALE 이후
            PERFORMANCE_INVALID_STATUS — 상태가 CANCELLED·ENDED

  /api/v1/performances/{performanceId}/media/{kind}:
    post:
      operationId: performance_16
      tags: [performance]
      summary: 공연 포스터·티켓 아트워크 저장
      description: >
        생성자 팀 리더가 DRAFT·PENDING_AGREEMENT 공연의 포스터 또는 티켓 아트워크를 저장한다.
        JPEG·PNG·WebP 5MB 이하만 허용하며 poster를 저장하면 공연의 posterImageUrl도 같이 갱신한다.
      x-priority: P0
      x-role: 리더
      x-screens: [P-03]
      x-features: [F-performance-01]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: performanceId
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: kind
          in: path
          required: true
          schema: { type: string, enum: [poster, ticket-artwork] }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: 미디어 저장 완료
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [imageUrl]
                        properties:
                          imageUrl: { type: string }
        '400':
          $ref: '#/components/responses/Error'
          description: COMMON_VALIDATION_FAILED — 지원하지 않는 kind·파일 형식, 빈 파일, 5MB 초과
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
          description: PERFORMANCE_NOT_OWNER — 생성자 팀 리더가 아님
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
          description: PERFORMANCE_ALREADY_ON_SALE 또는 PERFORMANCE_INVALID_STATUS
    get:
      operationId: performance_17
      tags: [performance]
      summary: 공연 포스터·티켓 아트워크 조회
      description: 공개 공연·티켓 화면이 사용할 저장 이미지 바이트를 반환한다.
      x-priority: P0
      x-role: GUEST
      x-screens: [A-01, A-02, A-03]
      x-features: [F-performance-02]
      security: []
      parameters:
        - name: performanceId
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: kind
          in: path
          required: true
          schema: { type: string, enum: [poster, ticket-artwork] }
      responses:
        '200':
          description: 저장된 이미지
          headers:
            Cache-Control:
              schema: { type: string, example: no-cache }
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        '400':
          $ref: '#/components/responses/Error'
          description: COMMON_VALIDATION_FAILED — 지원하지 않는 kind
        '404':
          $ref: '#/components/responses/Error'
          description: PERFORMANCE_NOT_FOUND — 저장된 해당 이미지가 없음


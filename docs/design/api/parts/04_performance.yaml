            PERFORMANCE_NOT_FOUND — 존재하지 않는 performanceId
        '409':
          $ref: '#/components/responses/Error'
          description: |
            PERFORMANCE_INVALID_STATUS — 아직 DRAFT·PENDING_AGREEMENT라 판매 데이터가 없음

  /api/v1/performances/{performanceId}/cancel:
    post:
      operationId: performance_12
      tags: [performance]
      summary: 공연 취소(일괄 환불)
      description: >
        판매 중 취소 시 전 티켓을 수수료 없이 일괄 환불하고 컨트랙트에 halt(showId)를 걸어 이후 refund만
        허용한다. 정산 잠금 이후에도 release 전까지는 가능하다. 환불은 온체인 코인 이동뿐이며(에스크로 →
        관객 지갑), 전 건 완료 후 운영자가 returnDeposit(showId)로 보증금을 생성팀 리더 지갑에 반환한다.
        대량 작업이라 202 + jobId이며 건별 부분 성공을 허용한다. release가 이미 실행된 공연은 취소할 수 없다.
        [2026-09-18 — S15P21B204-140] 판매 전(DRAFT·PENDING_AGREEMENT) 공연도 deposit_status=PAID면 받는다.
        보증금 50,000이 온체인 에스크로에 남는데 회수 경로가 이 엔드포인트뿐이기 때문이다. 그때 환불 대상은
        0건이고 targetTicketCount=0·totalRefundAmount=0으로 halt → returnDeposit 두 tx만 나간다 —
        returnDeposit이 stage ∈ {RELEASED, HALTED}를 요구하므로(컨트랙트 인터페이스 v1 §4.1 11행) 판매 전에도
        halt를 건너뛸 수 없다. 보증금을 내지 않은 판매 전 공연은 되돌릴 돈이 없어 그대로 409다.
      x-priority: P0
      x-role: 생성자
      x-screens: [P-10]
      x-features: [F-performance-12]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: performanceId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PerformanceCancelRequest'
            examples:
              default:
                value: { reason: 공연장 사정으로 부득이하게 취소되었습니다. }
      responses:
        '202':
          description: >
            운영자 tx(halt → 건별 refund → returnDeposit) 접수. §0.3 비동기 트랜잭션 규약을 따르며 jobId로
            GET /api/v1/chain/jobs/{jobId}를 폴링한다.
            [2026-09-16 — S15P21B204-92] 공용 ChainJobAccepted(jobId/status/pollAfterMs) 를 참조하던 것을
            CancelPerformanceResponse 실제 9필드로 바꿨다.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [jobId, status, pollAfterMs, performanceId, targetTicketCount, totalRefundAmount, currency, depositReturnPlanned]
                        properties:
                          jobId: { type: string, description: HALT job. 이 흐름의 대표 job 이다 }
                          status: { type: string, enum: [PENDING, SUBMITTED, CONFIRMED, FAILED] }
                          pollAfterMs: { type: integer, default: 2000 }
                          performanceId: { type: integer, format: int64 }
                          targetTicketCount: { type: integer }
                          totalRefundAmount: { $ref: '#/components/schemas/Money' }
                          currency: { type: string, enum: [KRW] }
                          depositReturnPlanned: { type: boolean }
                          depositAmount:
                            allOf: [{ $ref: '#/components/schemas/Money' }]
                            description: >
                              보증금이 없는 공연이면 서버가 null 을 담고 전역 non_null 직렬화가 키를 지운다.
                              그래서 required 가 아니다 — 0 과 구분해야 한다.
              examples:
                default:
                  value:
                    code: SUCCESS
                    data:
                      jobId: chain_01J8ZC4P7Q
                      status: PENDING
                      pollAfterMs: 2000
                      performanceId: 12
                      targetTicketCount: 64
                      totalRefundAmount: 1600000
                      currency: KRW
                      depositReturnPlanned: true
                      depositAmount: 50000
                    msg: 공연 취소를 접수했습니다. 환불이 순차적으로 처리됩니다.
        '400':
          $ref: '#/components/responses/Error'
          description: |
            COMMON_VALIDATION_FAILED — reason 누락, Idempotency-Key 헤더 없음
        '403':
          $ref: '#/components/responses/Error'
          description: |
            PERFORMANCE_NOT_OWNER — 생성자 팀 리더가 아님
        '404':
          $ref: '#/components/responses/Error'
          description: |
            PERFORMANCE_NOT_FOUND — 존재하지 않는 performanceId
        '409':
          $ref: '#/components/responses/Error'
          description: |
            COMMON_CONFLICT — 같은 멱등키에 다른 본문, 이미 취소 처리 진행 중
            COMMON_CONFLICT — 정산 실행(release)이 진행 중이라 공연을 취소할 수 없음
            PERFORMANCE_INVALID_STATUS — 이미 CANCELLED, 또는 판매 전(DRAFT·PENDING_AGREEMENT)인데 deposit_status ≠ PAID [2026-09-18 S15P21B204-140 — 보증금을 낸 판매 전 공연은 202]
            SETTLEMENT_ALREADY_RELEASED — release 완료 후 취소 시도
            COIN_ESCROW_INSUFFICIENT — 에스크로 잔액 < 환불 총액(대사 점검 대상)
        '500':
          $ref: '#/components/responses/Error'
          description: |
            CHAIN_GAS_INSUFFICIENT — 운영지갑 가스 부족 — 관리자 알림 대상

  /api/v1/performances/{performanceId}/deposit/prepare:
    post:
      operationId: performance_13
      tags: [performance]
      summary: 보증금 서명 파라미터
      description: >
        생성팀 리더가 보증금 50,000 YoYo를 RevenueSplitter.deposit(showId)에 납부하기 위해 서명할 tx를
        받는다(§0.4). signRequests는 최대 2건(APPROVE + DEPOSIT)이며 서명 주체는 리더 본인이다. 선행 조건은
        생성팀 리더·deposit_status=UNPAID·공연 DRAFT·리더 지갑 LINKED·잔액 ≥ 50,000·정산 규칙 저장이며, 잔액
        부족은 WALLET_BALANCE_INSUFFICIENT(409)로 막고 msg로 부족액만 안내한다. 정산 규칙이 없으면 createShow를 만들 수
        없으므로(ZeroRulesHash) 서명을 내려주지 않고 PERFORMANCE_RULES_REQUIRED(409)로 막는다[2026-09-17 S15P21B204-89,
        코드 분리 2026-09-20 S15P21B204-151]. 이 API의 COMMON_CONFLICT는 "이미 낸 보증금(PAID·RETURNED)" 하나만 뜻한다.
        createShow가 아직이면 운영자 job을 먼저 걸고 prerequisiteJobId를 함께 내려준다 — 프론트는 그 job이
        CONFIRMED가 된 뒤 서명한다. 가스 관련 필드는 없다(수수료는 운영지갑이 대납).
      x-priority: P0
      x-role: 생성자(팀 리더)
      x-screens: [P-03]
      x-features: [F-performance-10]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: performanceId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
            examples:
              default:
                value: {}
      responses:
        '200':
          description: 보증금 서명 파라미터
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PrepareResponse'
                          - type: object
                            properties:
                              performanceId: { type: integer, format: int64 }
                              depositAmount: { type: integer }
                              currency: { type: string }
                              display:
                                $ref: '#/components/schemas/Display'
                              prerequisiteJobId:
                                type: [string, 'null']
                              stepUpRequired:
                                type: boolean
                                description: "[2026-09-24] 본인 확인 스위치(STEP_UP_ENABLED)가 켜졌을 때만 true. 꺼져 있으면 키가 없다(전역 non_null). 화면은 이 값으로 보증금 서명 직전에 본인 확인 단계를 넣는다(범위 DEPOSIT·공연)"
              examples:
                default:
                  value:
                    code: SUCCESS
                    data:
                      performanceId: 12
                      depositAmount: 50000
                      currency: KRW
                      display: { currency: USD, approx: 37.04, rate: 1350.0, asOf: '2026-09-02T09:00:00+09:00' }
                      prerequisiteJobId: null
                      signRequests:
                        - kind: APPROVE
                          required: true
                          to: '0x5f1e2d3c4b5a69788796a5b4c3d2e1f009182736'
                          data: '0x095ea7b3...'
                          value: '0x0'
                          chainId: '0x3e9'
                          gas: '0x11170'
                          txType: FEE_DELEGATED_SMART_CONTRACT_EXECUTION
                          feePayer: '0x9f8e7d6c5b4a39281706f5e4d3c2b1a098765432'
                          summary: { title: 'Allow deposit of ₩50,000', amount: 50000, currency: KRW, spender: RevenueSplitter, spenderAddress: '0xa1b2c3d4e5f60718293a4b5c6d7e8f9012345678' }
                        - kind: DEPOSIT
                          required: true
                          to: '0xa1b2c3d4e5f60718293a4b5c6d7e8f9012345678'
                          data: '0xb6b55f25...'
                          value: '0x0'
                          chainId: '0x3e9'
                          gas: '0x1d4c0'
                          txType: FEE_DELEGATED_SMART_CONTRACT_EXECUTION
                          feePayer: '0x9f8e7d6c5b4a39281706f5e4d3c2b1a098765432'
                          summary: { title: 'Pay ₩50,000 show deposit', amount: 50000, currency: KRW, performanceId: 12 }
                      expiresAt: '2026-09-02T16:35:00+09:00'
                    msg: ''
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
          description: |
            PERFORMANCE_NOT_OWNER — 생성팀 리더가 아님
        '404':
          $ref: '#/components/responses/Error'
          description: |
            PERFORMANCE_NOT_FOUND — 존재하지 않는 performanceId
            WALLET_NOT_FOUND — 리더 지갑 미연결
        '409':
          $ref: '#/components/responses/Error'
          description: |
            COMMON_CONFLICT — deposit_status가 이미 PAID·RETURNED, 리더 지갑 YoYo 잔액 < 보증금, 또는 정산 규칙 미저장
            TEAM_MIN_COUNT_NOT_MET — 공동 공연인데 수락 완료 참여팀 2팀 미만(생성팀 포함)
            PERFORMANCE_INVALID_STATUS — 공연 상태가 DRAFT가 아님(CANCELLED 등)
        '502':
          $ref: '#/components/responses/Error'
          description: |
            COMMON_EXTERNAL_SERVICE_ERROR — 잔액·allowance 조회 실패(서명 파라미터를 만들 수 없음)

  /api/v1/performances/{performanceId}/deposit/signed-tx:
    post:
      operationId: performance_14
      tags: [performance]
      summary: 보증금 tx 해시 보고
      description: >
        리더가 만든 발신자 서명 RLP를 보고한다. 서버가 대납 서명 후 전송하고 202 + jobId(signerType=USER,
        feeDelegated=true)를 준 뒤 receipt와 DepositPaid 이벤트를 검증해 상태를 전이한다. kind=DEPOSIT의
        receipt가 확정되면 deposit_status가 UNPAID → PAID가 되고 nextAction이 SET_RULES로 넘어간다. 같은
        senderSignedRlp 재보고는 최초 jobId를 재생한다. 온체인 공연이 등록되지 않았으면(createShow job이
        CONFIRMED가 아니면) 브로드캐스트하지 않고 409로 막는다 — 보내도 ShowNotFound로 revert하고 대납
        가스만 든다[2026-09-17 S15P21B204-89]. 그 409는 원인에 따라 갈린다[2026-09-20 S15P21B204-151]:
        정산 규칙이 없어 createShow를 만들 수조차 없으면 PERFORMANCE_RULES_REQUIRED(performance_13과 같은
        코드 · 화면은 규칙 저장으로 보낸다)이고, 그 밖의 미확정(PENDING·SUBMITTED·FAILED)은
        COMMON_CONFLICT다 — FAILED는 기다려도 확정되지 않으므로 msg는 보증금 납부를 다시 시작하라고
        말한다. createShow job이 아예 없으면(= prepare를 건너뛴 순서 위반) 409가 아니라 404
        COMMON_NOT_FOUND다 — 시작한 적이 없다는 뜻이라 화면이 할 일이 다르다.
      x-priority: P0
      x-role: 생성자(팀 리더)
      x-screens: [P-03]
      x-features: [F-performance-10, F-wallet-06]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: X-Step-Up-Token
          in: header
          required: false
          schema: { type: string, maxLength: 128 }
          description: "[2026-09-24] 본인 확인 토큰(webauthn_04, 범위 DEPOSIT·공연). 서버 스위치 STEP_UP_ENABLED 가 켜져 있으면 필수 — 없거나 만료·소비·다른 동작/대상/회원의 토큰이면 403 WEBAUTHN_STEP_UP_REQUIRED. 권한·소유 검사가 먼저 돈다. APPROVE → DEPOSIT 두 보고는 같은 토큰으로 통과한다. 꺼져 있으면 읽지 않는다"
        - name: performanceId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignedTxRequest'
            examples:
              default:
                value: { kind: DEPOSIT, senderSignedRlp: '0x31f8a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f607182934a5b6c7d' }
      responses:
        '202':
          description: >
            대납 서명·전송 접수. receipt 검증(§0.4) 후 CONFIRMED 시 deposit_status=PAID로 전이한다.
            [2026-09-16 — S15P21B204-92] 공용 ChainJobAccepted 를 참조하던 것을 DepositSignedTxResponse
            실제 10필드로 바꿨다.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [jobId, status, signerType, pollAfterMs, performanceId, kind, feeDelegated, nextDepositStatus]
                        properties:
                          jobId: { type: string }
                          status: { type: string, enum: [PENDING, SUBMITTED, CONFIRMED, FAILED] }
                          signerType: { type: string, enum: [OPERATOR, USER] }
                          pollAfterMs: { type: integer, default: 1500 }
                          performanceId: { type: integer, format: int64 }
                          kind: { type: string, enum: [APPROVE, DEPOSIT], description: 보고한 서명의 종류 }
                          feeDelegated: { type: boolean }
                          txHash:
                            allOf: [{ $ref: '#/components/schemas/TxHash' }]
                            description: >
                              전송 전(PENDING)이면 서버가 아직 해시를 모른다. null 을 담으면 non_null
                              직렬화가 키를 지우므로 required 가 아니다.
                          explorerUrl:
                            type: string
                            format: uri
                            description: txHash 가 없으면 이 키도 없다(같은 자리에서 파생한다).
                          nextDepositStatus:
                            type: string
                            enum: [UNPAID, PAID, RETURNED, FORFEITED]
                            description: 확정 시 보증금 상태. DEPOSIT 보고면 PAID, APPROVE 보고면 현재 값 그대로다.
              examples:
                default:
                  value:
                    code: SUCCESS
                    data:
                      jobId: chain_01J9GA1B2C
                      status: SUBMITTED
                      signerType: USER
                      pollAfterMs: 1500
                      performanceId: 12
                      kind: DEPOSIT
                      feeDelegated: true
                      txHash: '0x6c7d8e9f0a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5'
                      explorerUrl: https://kairos.kaiascan.io/tx/0x6c7d8e9f0a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5
                      nextDepositStatus: PAID
                    msg: 보증금 트랜잭션을 확인하고 있습니다.
        '400':
          $ref: '#/components/responses/Error'
          description: |
            COMMON_VALIDATION_FAILED — RLP 형식 위반·디코드 실패, 허용되지 않는 kind
        '403':
          $ref: '#/components/responses/Error'
          description: |
            PERFORMANCE_NOT_OWNER — 생성팀 리더가 아님
            WEBAUTHN_STEP_UP_REQUIRED — [2026-09-24] 스위치 켜짐 + X-Step-Up-Token 없음·만료·소비·범위(DEPOSIT·공연) 불일치
        '404':
          $ref: '#/components/responses/Error'
          description: |
            PERFORMANCE_NOT_FOUND — 존재하지 않는 performanceId
            COMMON_NOT_FOUND — prepare 발의 기록(그 공연의 CREATE_SHOW chain_job)이 없음(순서 위반). 규칙 미저장이 먼저 걸리므로 이 줄은 규칙이 있는 경우다
        '409':
          $ref: '#/components/responses/Error'
          description: |
            COMMON_CONFLICT — 이미 deposit_status=PAID, 온체인 공연 미등록(createShow job이 PENDING·SUBMITTED·FAILED), 또는 같은 RLP가 다른 공연·다른 회원으로 보고됨
            PERFORMANCE_RULES_REQUIRED — 정산 규칙 미저장(performance_13과 같은 코드)
            PAYMENT_AMOUNT_MISMATCH — RLP에서 복구한 발신자 ≠ 리더 지갑, to·data가 prepare 발급값과 다름, 또는 receipt·이벤트 검증 실패(to·from·showId·amount·이벤트 부재)
        '500':
          $ref: '#/components/responses/Error'
          description: |
            CHAIN_GAS_INSUFFICIENT — 운영지갑(fee payer) 잔액 부족으로 대납 전송 불가 — 운영자 알림 대상
        '504':
          $ref: '#/components/responses/Error'
          description: |
            CHAIN_TX_TIMEOUT — 제출은 됐으나 확정이 120초를 넘김 — jobId로 계속 폴링

components:
  schemas:
    PerformanceStatus:
      type: string
      enum: [DRAFT, PENDING_AGREEMENT, ON_SALE, SALE_CLOSED, ENDED, CANCELLED]
    PerformanceDepositStatus:
      type: string
      enum: [UNPAID, PAID, RETURNED]
    ParticipationStatus:
      type: string
      enum: [INVITED, ACCEPTED]
    RateBrief:
      type: object
      description: 목록·요약 응답에 반복되는 §0.5 축약형 표시 환율
      properties:
        currency: { type: string, example: USD }
        rate: { type: number, example: 1350.0 }
        asOf: { type: string, format: date-time }
    PerformanceCreateRequest:
      type: object
      required: [hostTeamId, title, venueName, venueAddress, startAt, endAt, jointPerformance]
      properties:
        hostTeamId: { type: integer, format: int64, description: 요청자가 리더인 팀. 주최(생성자) 팀 }
        title: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 2000 }
        posterUploadId:
          type: string
          format: uuid
          maxLength: 36
          description: >-
            POST /api/v1/files 가 준 uploadId(purpose=POSTER). [2026-09-22 파괴적 변경] 이전 필드
            posterImageUrl 은 제거됐다 — 보내면 알 수 없는 필드 거부로 COMMON_VALIDATION_FAILED(400).
        ticketArtworkUploadId:
          type: string
          format: uuid
          maxLength: 36
          description: POST /api/v1/files 가 준 uploadId(purpose=TICKET_ARTWORK).
        venueName: { type: string, minLength: 1, maxLength: 100 }
        venueAddress: { type: string, minLength: 1, maxLength: 200 }
        startAt: { type: string, format: date-time, description: 현재 이후 }
        endAt: { type: string, format: date-time, description: startAt 이후. ENDED 전이 기준 }
        jointPerformance: { type: boolean, description: '공동 공연 여부. true면 참여팀 2팀 이상 필수. 화면설계 v7 P-03 — 참여팀 초대가 생성 이후 단계라 생성 시점엔 2팀을 채울 수 없어 화면은 이 필드를 입력받지 않고 false로 고정해 보낸다(TEAM_MIN_COUNT_NOT_MET 회피). 데모 범위는 단독 공연만' }

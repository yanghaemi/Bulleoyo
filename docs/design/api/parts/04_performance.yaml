        host: { type: boolean }
        participationStatus:
          $ref: '#/components/schemas/ParticipationStatus'
        myTeamAgreementStatus:
          type: string
          enum: [PENDING, SIGNING, AGREED]
        pendingSignature:
          type: [string, 'null']
          enum: [DEPOSIT, AGREE, TREASURY_IN, null]
          description: >
            이 회원이 지금 서명해야 하는 작업, 또는 null. myParticipatingTeams[0]의 값과 같다.
        myTeamSettlementApproved:
          type: boolean
          description: >
            내 팀(teamId)의 정산 조기 동의(API-settlement-08) 여부. 정산 행이나 내 팀 몫(settlement_share)이
            아직 없으면 키를 생략한다 — 모르는 값을 미동의로 단정하지 않는다. myParticipatingTeams[0].settlementApproved와 같다.
        myParticipatingTeams:
          type: array
          description: >
            이 공연에 엮인, 요청자가 리더인 팀 전부. 한 회원이 두 팀을 이끌고 둘 다 같은 공연에 참여하면
            행이 갈리지 않고 이 배열이 2개가 된다. 정렬은 주최팀 우선 → teamId 오름차순이며, 위 평면 필드
            (teamId·host·participationStatus·myTeamAgreementStatus·pendingSignature·myTeamSettlementApproved)는
            이 배열의 첫 항목과 같다.
          items:
            $ref: '#/components/schemas/MyParticipatingTeam'

    MyPerformanceListItem:
      type: object
      required: [host]
      properties:
        performanceId: { type: integer, format: int64 }
        title: { type: string }
        posterImageUrl: { type: string, format: uri }
        ticketImageUrl: { type: string, format: uri }
        startAt: { type: string, format: date-time }

      type: object
      required: [host]
      properties:
        teamId: { type: integer, format: int64 }
        teamName: { type: string }
        host: { type: boolean }
        participationStatus:
          $ref: '#/components/schemas/ParticipationStatus'
        agreementStatus:
          type: string
          enum: [PENDING, SIGNING, AGREED]
        pendingSignature:
          type: [string, 'null']
          enum: [DEPOSIT, AGREE, TREASURY_IN, null]
          description: >
            팀 단위 판정이다 — DEPOSIT 은 그 팀이 주최팀일 때만, AGREE 는 그 팀의 동의가 PENDING 일 때만.
        settlementApproved:
          type: boolean
          description: >
            그 팀의 정산 조기 동의(API-settlement-08) 여부. 정산 행이나 그 팀 몫(settlement_share)이 없으면 생략한다.

components:
  schemas:
    CoinSupplyInvariant:
      type: object
      description: "발행량 대사 불변식 4개(결정 v2 §3.8) 중 1건의 검사 결과"
      required: [matched]
      properties:
        # YAML 1.1 은 따옴표 없는 no 를 boolean false 로 읽어 필드 이름이 `false` 가 되고,
        # 생성 타입이 `false?: 1|2|3|4` 로 나온다. build.py 는 1.2 식 로더로 읽고 불리언 키를 실패로 막는다.
        # 백엔드는 `no` 를 보낸다(CoinDtos.Invariant record 의 Integer no).
        no:
          type: integer
          enum: [1, 2, 3, 4]
        name:
          type: string
          enum: [SUPPLY_EQUALS_MINTED, ESCROW_PER_SHOW, RELEASED_EQUALS_RULE_RECALC, SUPPLY_EQUALS_WALLETS_PLUS_ESCROW]
        expected:
          type: integer
          nullable: true
          description: >
            no 별 뜻이 고정돼 있다(프론트 라벨이 이 순서를 그대로 쓴다 — MR !87 · D-47).
            no 1: Σ Minted(확정 MINT job 합) · no 4: Σ등록 지갑 온체인 잔액(노드 balanceOf) + Σ에스크로·보증금.
            no 2·3 은 쓰지 않는다(checkedShows/mismatchedShows·maxDiff 로 판정).
            **못 읽은 값이 하나라도 있으면 expected·actual 둘 다 null** 이고 matched 는 true 로 남는다
            (판정 불가 — 화면은 "확인 중"으로 그린다. 불일치가 아니므로 halt 하지 않는다).
        actual:
          type: integer
          nullable: true
          description: >
            no 1·4 모두 온체인 YoYo.totalSupply(). 차액 = actual − expected. no 4 에서 **양수 = 등록 지갑 밖 주소가 든 코인**
            (등록 지갑은 전부 노드에서 읽었으므로 이제 이 뜻으로 확정 — 2026-09-15 S15P21B204-88). 음수(expected > actual)는
            장부 과대계상(에스크로 이중 계상 또는 스캔 도중 확정된 이동이 양쪽에 세어짐)이고 미등록 보유로는 음수가 될 수 없다.
        checkedShows:
          type: integer
          nullable: true
        mismatchedShows:
          type: integer
          nullable: true
        maxDiff:
          type: integer
          nullable: true
        matched:
          type: boolean
        note:
          type: string
          description: >
            사람이 읽는 판정 사유 한 줄. **서버가 한국어로 고정한다** — §0.6 의 Accept-Language 로케일은 이 필드에
            적용되지 않는다(MessageSource 배선은 W5 이후 별건, 2026-09-15 S15P21B204-90 D-37). 화면은 이 문자열을
            파싱하지 않고 그대로 출력만 한다 — 행의 상태는 expected/actual/checkedShows/maxDiff 의 null 여부로 정한다.
            미평가 문구는 행마다 다르다 — 불변식 1·2·4 는 "… 조회 불가 — …(미평가)" 로 끝나고,
            불변식 3 은 평가 못 한 건수를 적는다("평가한 정산 없음(미평가 N건); …").

    CoinSupply:
      type: object
      description: "GET /coin/supply 공시 데이터. v4 유통량 요약 + 구 API-verify-02 상세 공시 통합([v5])"
      required: [supplyMatched, mintHalted, releaseHalted, stale]
      properties:
        totalSupply:
          type: integer
          description: "YoYo.totalSupply(). 소각이 없어 단조 증가"
        escrowTotal:
          type: integer
          description: "전 공연 escrowOf 합 + 보증금 합"
        walletTotal:
          type: integer
          description: >
            등록(LINKED) 지갑 보유 합계 — 노드 YoYo.balanceOf 를 지갑별로 읽어 합산(2026-09-15, S15P21B204-88).
            등록 지갑 밖(미등록·SUSPENDED) 주소 보유분만큼 totalSupply − escrowTotal 보다 작을 수 있고 그것은 정상이다(양의 차액 = 미등록 보유).
            불변식 4 가 미평가(지갑 하나라도 못 읽음)면 0 으로 오지만 사실이 아니다 — invariants[no=4].expected 가 null 이면
            이 값을 표시하지 않는다.
        grantCount:
          type: integer
          description: "[v5] 확정된 MINT job 건수(= 지급 횟수)"
        supplyMatched:
          type: boolean
          description: |
            불변식 1·4 모두 통과 여부(발행량 대사). false면 mintHalted·releaseHalted가 모두 true가 된다.
            **releaseHalted는 이 값만으로 결정되지 않는다** — 불변식 3(정산 재계산) 불일치도 releaseHalted를 켠다(supplyMatched는 그대로).
            조회 맥락별 기준(2026-09-10): **공시 화면(V-02, 이 API)** 에서 "정산 release 가능 여부"를 표시할 때는 releaseHalted를 참조한다.
            **정산 상세 화면(P-08, API-settlement-01)** 의 release 버튼 활성은 `actions.release.available`·`blockedReason`을 따른다 —
            서버 게이트가 releaseHalted를 이미 접어 넣어(`COIN_RESERVE_MISMATCH`) 두 값이 어긋나지 않는다. 화면이 두 필드를 따로 조합하지 않는다.
        currency:
          type: string
          enum: [KRW]
        display:
          $ref: '#/components/schemas/Display'
        issuer:
          type: object
          properties:
            type:
              type: string
              enum: [MOCK, EXTERNAL]
            label:
              type: string
            replaceable:
              type: boolean
        mintHalted:
          type: boolean
          description: 지급(mint) 중단 — 불변식 1 또는 4 불일치
        releaseHalted:
          type: boolean
          description: 정산 release 중단 — 불변식 1 또는 4 불일치 **또는 불변식 3(정산 재계산) 불일치**. 노드 조회 불가는 중단 사유가 아니다(미평가). 공시 화면(V-02) 표시용 — 정산 상세(P-08)의 버튼은 API-settlement-01 `actions.release`가 정본이며 이 값을 이미 포함한다
        network:
          type: string
        chainId:
          type: integer
        tokenAddress:
          $ref: '#/components/schemas/Address'
        tokenSymbol:
          type: string
          enum: [YoYo]
        tokenDecimals:
          type: integer
          enum: [0]
        explorerUrl:
          type: string
          format: uri
        invariants:
          type: array
          items:
            $ref: '#/components/schemas/CoinSupplyInvariant'
        perPerformanceEscrow:
          type: array
          items:
            type: object
            properties:
              performanceId: { type: integer }
              escrowAmount: { type: integer }
              depositAmount: { type: integer }
        asOf:
          type: string
          format: date-time
        nextRefreshAt:
          type: string
          format: date-time
        stale:
          type: boolean
          description: "totalSupply·에스크로 중 하나라도 노드에서 읽지 못했으면 true. 등록 지갑 잔액을 못 읽은 것은 켜지 않는다 — 켜면 불변식 1·2·3 행까지 판정 불가로 덮여 실제 불일치가 가려진다. 그때 walletTotal은 0, 불변식 4는 미평가(값 null)이고 화면은 지갑 합계를 —로 그린다. 사유는 구분하지 않는다 — 불변식 note가 말한다"
        disclosure:
          type: string
          description: "Accept-Language에 맞춘 고지 문구(CON-03)"
        grantNotice:
          type: string

    ExchangeRate:
      type: object
      properties:
        pair:
          type: string
          example: USD_KRW
        base:
          type: string
        quote:
          type: string
          enum: [KRW]
        rate:
          type: number
          description: "1 base = rate KRW"
        effectiveFrom:
          type: string
          format: date-time
        source:
          type: string
          default: MANUAL

    ExchangeRateRegisterItem:
      type: object
      required: [pair, rate]
      properties:
        pair:
          type: string
          pattern: '^[A-Z]{3}_KRW$'
        rate:
          type: number
          exclusiveMinimum: 0
          description: "소수 6자리까지"
        effectiveFrom:
          type: string
          format: date-time
          description: "현재 이후. 미지정 시 now"
        source:
          type: string
          default: MANUAL
          maxLength: 100

    ExchangeRateRegisterRequest:
      type: object
      required: [rates]
      properties:
        rates:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/ExchangeRateRegisterItem'

    ExchangeRateRegisterResult:
      type: object
      required: [cacheInvalidated]
      properties:
        registered:
          type: array
          items:
            type: object
            properties:
              rateId: { type: integer }
              pair: { type: string }
              rate: { type: number }
              effectiveFrom: { type: string, format: date-time }
              source: { type: string }
        publishedBy:
          type: integer
          description: "등록한 관리자 memberId"
        cacheInvalidated:
          type: boolean
        usageNotice:
          type: string

    ChainConfig:
      type: object
      description: "[P1] Web3Auth SDK·지갑 연결 초기화용 공개 설정"
      properties:
        network:
          type: string
        chainNamespace:
          type: string
          enum: [eip155]
        chainId:
          type: integer
        chainIdHex:
          type: string
        displayName:
          type: string
        ticker:
          type: string
          enum: [KAIA]
        tickerName:
          type: string
        rpcTarget:
          type: string
          format: uri
        explorerBaseUrl:
          type: string
          format: uri
        contracts:
          type: object
          properties:
            tokenAddress:
              $ref: '#/components/schemas/Address'
            tokenSymbol:
              type: string
              enum: [YoYo]
            tokenDecimals:
              type: integer
              enum: [0]
            splitterAddress:
              $ref: '#/components/schemas/Address'
            abiVersion:
              type: string
        web3auth:
          type: object
          properties:
            clientIdPublic:
              type: string
              description: "SDK 초기화용 공개 클라이언트 ID. 비밀키·verifier 시크릿은 담지 않는다"
            loginProviders:
              type: array
              items:
                type: string
        feePolicy:
          type: object
          properties:
            feeDelegation:
              type: boolean
              enum: [true]
            feePayerAddress:
              $ref: '#/components/schemas/Address'
            userNativeBalanceRequired:
              type: boolean
              enum: [false]
        refreshedAt:
          type: string
          format: date-time

    CoinGrantRequest:
      type: object
      required: [amount]
      description: "memberId·address는 택일(둘 다 오면 COMMON_VALIDATION_FAILED)"
      properties:
        memberId:
          type: integer
          nullable: true

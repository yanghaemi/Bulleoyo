  /api/v1/chain/jobs/{jobId}:
    get:
      operationId: chain_01
      tags: [chain]
      x-priority: P0
      x-screens: ["공통(202 폴링)"]
      x-features: [F-coin-03]
      x-role: "요청자(작업을 만든 회원) 또는 ADMIN"
      summary: 비동기 tx 작업 상태 조회
      description: >-
        모든 202 응답(운영자 tx + 사용자 서명 tx)의 단일 폴링 엔드포인트다. 상태값은 PENDING/SUBMITTED/
        CONFIRMED/FAILED이며, 확정 시 txHash·explorerUrl, 실패 시 failureReason·retryable을 채운다.
        signerType=USER인 job은 feeDelegated가 항상 true이고 retryable은 항상 false다(서버가 발신자 서명을
        다시 만들 수 없어 사용자가 다시 서명해야 한다). verification 블록으로 receipt 검증 결과(to·from·event·args)를
        알려준다. 작업을 만든 회원 또는 ADMIN만 조회하며, 남의 작업은 존재를 숨겨 COMMON_NOT_FOUND로 응답한다.
        부분 성공이 있는 작업(공연 취소 일괄 환불, release)은 results 배열로 건별 상태를 함께 준다.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: jobId
          in: path
          required: true
          schema: { type: string }
          description: "202 응답에서 받은 작업 식별자(chain_*)"
      responses:
        '200':
          description: "작업 상태 조회 성공(사용자 서명 tx 확정 / 운영자 tx 최종 실패 / 사용자 서명 tx 검증 실패)"
          content:
            application/json:
              schema:

# 2026-09-08: 코인 개명 KRWS -> YoYo (name·symbol "YoYo", 로직 불변)
paths:
  /api/v1/coin/supply:
    get:
      operationId: coin_01
      tags: [coin]
      x-priority: P0
      x-screens: [V-02]
      x-features: [F-coin-02, F-verify-02]
      x-role: GUEST
      summary: "YoYo 발행량·에스크로 공시"
      description: >-
        발행량 요약(총 발행량·에스크로·지갑 보유 합계·지급 건수)과 불변식 4개 대사 결과를 한 응답으로 준다.
        [v5] v4의 유통량 요약(구 API-coin-01)과 상세 공시(구 API-verify-02)가 통합된 공개 API다. 1분 캐시.
        불변식 1 또는 4가 깨지면 supplyMatched: false와 함께 mint·release를 중단(mintHalted·releaseHalted)하고,
        불변식 3(정산 재계산)이 깨지면 releaseHalted만 true가 되며,
        운영자 알림을 보내되, 조회 자체는 200으로 성공시킨다. 관객 화면에는 노출하지 않는 발행 주체 라벨과
        고지 문구(disclosure)를 Accept-Language에 맞춰 함께 내린다.
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: 발행량·에스크로 공시 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CoinSupply'
              examples:
                default:
                  value:
                    code: SUCCESS
                    data:
                      totalSupply: 5290000
                      escrowTotal: 1275000
                      walletTotal: 4015000
                      grantCount: 53
                      supplyMatched: true
                      currency: KRW
                      display: { currency: USD, approx: 3918.52, rate: 1350.0, asOf: "2026-09-02T09:00:00+09:00" }
                      issuer: { type: MOCK, label: "Platform (demo grant)", replaceable: true }
                      mintHalted: false
                      releaseHalted: false
                      network: kaia-kairos
                      chainId: 1001
                      tokenAddress: "0x5f1e2d3c4b5a69788796a5b4c3d2e1f009182736"
                      tokenSymbol: YoYo
                      tokenDecimals: 0
                      explorerUrl: "https://kairos.kaiascan.io/address/0x5f1e2d3c4b5a69788796a5b4c3d2e1f009182736"
                      invariants:
                        - { no: 1, name: SUPPLY_EQUALS_MINTED, expected: 5290000, actual: 5290000, matched: true, note: "totalSupply = Σ Minted — mint 만 있어 발행량은 줄지 않는다" }
                        - { no: 2, name: ESCROW_PER_SHOW, checkedShows: 2, mismatchedShows: 0, matched: true, note: "공연별 escrowOf = Σpurchase − Σrefund − Σrelease (보증금 별도)" }
                        - { no: 3, name: RELEASED_EQUALS_RULE_RECALC, checkedShows: 1, maxDiff: 0, matched: true, note: "Σ Released = 잠긴 규칙 × 카운터 재계산(dust 포함, 1원 오차 없음); 온체인 choiceCountsOf 카운터로 평가 1건" }
                        - { no: 4, name: SUPPLY_EQUALS_WALLETS_PLUS_ESCROW, expected: 5290000, actual: 5290000, matched: true, note: "totalSupply = Σ등록 지갑 잔액 + Σ에스크로·보증금 — 정확히 일치 (등록 지갑 3개 노드 조회)" }
                      perPerformanceEscrow:
                        - { performanceId: 12, escrowAmount: 1225000, depositAmount: 50000 }
                        - { performanceId: 14, escrowAmount: 0, depositAmount: 0 }
                      asOf: "2026-09-22T18:12:00+09:00"
                      nextRefreshAt: "2026-09-22T18:13:00+09:00"
                      stale: false
                      disclosure: "A testnet demo set in a future where money is a coin. No real assets or currency. Coins are granted by the platform for the demo; balance figures are read through the platform server."
                      grantNotice: "Every coin in circulation came from a demo grant: 100,000 on sign-up, plus manual admin grants."
                    msg: ""
        '429':
          $ref: '#/components/responses/Error'
          description: "COMMON_TOO_MANY_REQUESTS — 호출 한도 초과"
        '502':
          $ref: '#/components/responses/Error'
          description: "COMMON_EXTERNAL_SERVICE_ERROR — 체인 조회 실패하고 캐시도 없음"

  /api/v1/coin/rates:
    get:
      operationId: coin_02
      tags: [coin]
      x-priority: P0
      x-screens: [공통]
      x-features: [F-coin-06]
      x-role: GUEST
      summary: 표시 환율 조회
      description: >-
        현재 유효한 표시 환율을 pair별로 준다. 표시 전용이며 결제·정산·컨트랙트 계산에는 쓰이지 않는다(usageNotice로 명시).
        1 base = rate KRW 방향이다. pair 쿼리로 하나만 조회할 수 있고 미지정 시 등록된 전부를 준다. 1분 캐시.
        등록된 환율이 없으면 빈 배열을 준다(404가 아니다) — 환율 미등록은 오류가 아니다.
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: pair
          in: query
          required: false
          schema:
            type: string
            pattern: '^[A-Z]{3}_KRW$'
          description: "예: USD_KRW·JPY_KRW·EUR_KRW. 미지정 시 전체"
      responses:
        '200':
          description: 표시 환율 목록 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          rates:
                            type: array
                            items:
                              $ref: '#/components/schemas/ExchangeRate'
                          usageNotice:
                            type: string
                          refreshedAt:
                            type: string
                            format: date-time
              examples:
                default:
                  value:
                    code: SUCCESS
                    data:
                      rates:
                        - { pair: USD_KRW, base: USD, quote: KRW, rate: 1350.0, effectiveFrom: "2026-09-02T09:00:00+09:00", source: MANUAL }
                        - { pair: JPY_KRW, base: JPY, quote: KRW, rate: 9.12, effectiveFrom: "2026-09-02T09:00:00+09:00", source: MANUAL }
                        - { pair: EUR_KRW, base: EUR, quote: KRW, rate: 1462.5, effectiveFrom: "2026-09-02T09:00:00+09:00", source: MANUAL }
                      usageNotice: "Rates are for display only. All payments, refunds and settlements are calculated in Korean won."
                      refreshedAt: "2026-09-02T14:00:00+09:00"
                    msg: ""
        '400':
          $ref: '#/components/responses/Error'
          description: "COMMON_VALIDATION_FAILED — pair 형식 위반({3자}_{3자} 아님)"
        '429':
          $ref: '#/components/responses/Error'
          description: "COMMON_TOO_MANY_REQUESTS — 호출 한도 초과"

  /api/v1/admin/coin/rates:
    put:
      operationId: coin_03
      tags: [coin]
      x-priority: P0
      x-screens: [M-03]
      x-features: [F-coin-07]
      x-role: ADMIN
      summary: 표시 환율 등록
      description: >-
        관리자가 pair별 표시 환율을 등록한다. 하루 1회 시연 고정을 전제로 한 최소 기능이다. 등록은 append-only다 —
        기존 레코드를 수정하지 않고 새 exchange_rate 행을 만든다. effectiveFrom은 미래 시각도 허용하고 과거 시각은
        기존 표시값을 소급 변경하므로 거부한다. 여러 pair를 한 번에 등록할 수 있고 부분 실패 없이 전량 롤백한다.
        이 값이 자금 계산에 쓰이지 않음을 usageNotice로 다시 명시한다. 감사 로그 action_type=RATE_CHANGE로 남긴다.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExchangeRateRegisterRequest'
            examples:
              default:
                value:
                  rates:
                    - { pair: USD_KRW, rate: 1350.0, source: MANUAL }
                    - { pair: JPY_KRW, rate: 9.12, source: MANUAL }
      responses:
        '200':
          description: 표시 환율 등록 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ExchangeRateRegisterResult'
              examples:
                default:
                  value:
                    code: SUCCESS
                    data:
                      registered:
                        - { rateId: 56, pair: USD_KRW, rate: 1350.0, effectiveFrom: "2026-09-02T09:00:00+09:00", source: MANUAL }
                        - { rateId: 57, pair: JPY_KRW, rate: 9.12, effectiveFrom: "2026-09-02T09:00:00+09:00", source: MANUAL }
                      publishedBy: 1
                      cacheInvalidated: true
                      usageNotice: "표시 환산에만 사용됩니다. 정산·분배·티켓 가격·지급 금액은 YoYo(=₩) 정수로 계산됩니다."
                    msg: "표시 환율이 등록되었습니다."
        '400':
          $ref: '#/components/responses/Error'
          description: |
            COMMON_VALIDATION_FAILED — pair 형식·quote 위반, rate ≤ 0, effectiveFrom 과거, 배열 내 pair 중복, 배열 크기 위반(예: "적용 시각은 현재 이후여야 합니다")
        '401':
          $ref: '#/components/responses/Error'
          description: "COMMON_UNAUTHORIZED — 인증 헤더 없음"
        '403':
          $ref: '#/components/responses/Error'
          description: "COMMON_FORBIDDEN — ADMIN이 아님"

  /api/v1/coin/config:
    get:
      operationId: coin_04
      tags: [coin]
      x-priority: P1
      x-screens: ["공통(프론트 초기화)"]
      x-features: [F-coin-09]
      x-role: GUEST
      summary: 체인·컨트랙트 설정 조회
      description: >-
        [P1] 프론트가 Web3Auth SDK와 지갑 연결을 초기화하는 데 필요한 값(chainNamespace·chainId·rpcTarget·
        컨트랙트 주소 등)을 준다. 비인증 공개이며 여기 담기는 값은 모두 공개 정보다. 서버 보관 키(OPERATOR·
        MINTER)의 주소는 담지 않는다. 5분 캐시하며 컨트랙트 재배포 시 즉시 무효화한다. contracts.abiVersion으로
        프론트 번들 ABI와 서버가 가리키는 컨트랙트 세대를 맞춘다.
      security: []
      responses:
        '200':
          description: 체인·컨트랙트 설정 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ChainConfig'
              examples:
                default:
                  value:
                    code: SUCCESS
                    data:
                      network: kaia-kairos
                      chainNamespace: eip155
                      chainId: 1001
                      chainIdHex: "0x3e9"
                      displayName: "Kaia Kairos"
                      ticker: KAIA
                      tickerName: Kaia
                      rpcTarget: "https://public-en-kairos.node.kaia.io"
                      explorerBaseUrl: "https://kairos.kaiascan.io"
                      contracts:
                        tokenAddress: "0x5f1e2d3c4b5a69788796a5b4c3d2e1f009182736"
                        tokenSymbol: YoYo
                        tokenDecimals: 0
                        splitterAddress: "0xa1b2c3d4e5f60718293a4b5c6d7e8f9012345678"
                        abiVersion: v5.0.0
                      web3auth: { clientIdPublic: "BJ8xk...public", loginProviders: [google, facebook, kakao] }
                      feePolicy: { feeDelegation: true, feePayerAddress: "0x9f8e7d6c5b4a39281706f5e4d3c2b1a098765432", userNativeBalanceRequired: false }
                      refreshedAt: "2026-09-02T14:00:00+09:00"
                    msg: ""
        '429':
          $ref: '#/components/responses/Error'
          description: "COMMON_TOO_MANY_REQUESTS — 호출 한도 초과"
        '500':
          $ref: '#/components/responses/Error'
          description: "COMMON_INTERNAL_ERROR — 컨트랙트 주소 설정 누락(배포 전 상태) — 관리자 알림 대상"

  /api/v1/admin/coin/grants:
    put:
      operationId: coin_07
      tags: [coin]
      x-priority: P0
      x-screens: [M-03]
      x-features: [F-coin-10, F-coin-01, F-coin-08]
      x-role: ADMIN
      summary: 시연용 코인 지급
      description: >-
        관리자가 특정 회원 지갑에 YoYo를 지급한다. v4의 법정화폐 유입 도메인을 대체하는 유일한 유입 경로이며
        관객 화면에는 진입점이 없다. 대상은 memberId 또는 address 중 하나다. 1회 최대 1,000,000 YoYo, 최소 1.
        Idempotency-Key가 필수이며 그 UUID 해시가 온체인 YoYo.mint의 grantRef가 되어 같은 키 재호출은 두 번
        발행하지 않는다. 발행량 대사가 깨진 상태(mintHalted)에서는 지급을 거부한다(COIN_RESERVE_MISMATCH).
        메서드가 PUT인 것은 결정 문서 v2 §9 인벤토리 표기를 그대로 따른 것이며, 멱등키 필수라 PUT 의미와도
        어긋나지 않는다. 202 Accepted + jobId(tx_type=MINT, signer_type=OPERATOR)를 준다.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoinGrantRequest'
            examples:
              default:
                value: { memberId: 1024, amount: 200000, memo: "Rehearsal top-up for demo audience" }
      responses:
        '202':
          description: >
            지급 tx(MINT) 접수. jobId 로 GET /api/v1/chain/jobs/{jobId} 를 폴링한다.
            [2026-09-16 — S15P21B204-92] 공용 ChainJobAccepted 를 참조하던 것을 GrantCoinResponse
            실제 14필드로 바꿨다.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [jobId, status, signerType, pollAfterMs, memberId, address, amount, currency, grantRef, requestedAt]
                        properties:
                          jobId: { type: string }
                          status: { type: string, enum: [PENDING, SUBMITTED, CONFIRMED, FAILED] }
                          signerType: { type: string, enum: [OPERATOR, USER] }
                          pollAfterMs: { type: integer, default: 1500 }
                          memberId: { type: integer, format: int64, description: 요청이 address 로 왔어도 지갑 주인의 memberId 를 채워 돌려준다 }
                          address: { $ref: '#/components/schemas/Address' }
                          amount: { $ref: '#/components/schemas/Money' }
                          currency: { type: string, enum: [KRW] }
                          display:
                            allOf: [{ $ref: '#/components/schemas/Display' }]
                            description: 표시 환율이 없으면 서버가 null 을 담고 키가 사라진다(§0.5).
                          memo: { type: string, description: 요청 본문의 memo 그대로. 생략하면 키가 없다 }
                          grantRef: { type: string, description: 'bytes32 hex. 멱등키의 sha3 이며 V-02·익스플로러 대조 키다' }
                          balanceBefore:
                            allOf: [{ $ref: '#/components/schemas/Money' }]
                            description: >
                              Redis 캐시 잔액. 캐시가 비어 있으면 키가 없다 — 0 과 구분해야 한다(M-03 표시용).
                          expectedBalanceAfter:
                            allOf: [{ $ref: '#/components/schemas/Money' }]
                            description: balanceBefore 가 없으면 이 키도 없다(그 값에서 파생한다).
                          requestedAt: { type: string, format: date-time }
              examples:
                default:
                  value:
                    code: SUCCESS
                    data:
                      jobId: chain_01J9H2K3L4
                      status: PENDING
                      signerType: OPERATOR
                      pollAfterMs: 1500
                      memberId: 1024
                      address: '0x6d5c4b3a29180f7e6d5c4b3a29180f7e6d5c4b3a'
                      amount: 200000
                      currency: KRW
                      display: { currency: USD, approx: 148.15, rate: 1350.0, asOf: '2026-09-02T09:00:00+09:00' }
                      memo: Rehearsal top-up for demo audience
                      grantRef: '0x8f0a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8'
                      balanceBefore: 35000
                      expectedBalanceAfter: 235000
                      requestedAt: '2026-09-22T18:20:00+09:00'
                    msg: 지급 트랜잭션을 전송했습니다.
        '400':
          $ref: '#/components/responses/Error'
          description: |
            COMMON_VALIDATION_FAILED — memberId·address 둘 다 또는 둘 다 없음, 주소 형식 위반, amount 범위 위반(1회 한도 초과 — 전용 코드 COIN_GRANT_LIMIT_EXCEEDED는 §16.1, 예: "1회 지급 한도(₩1,000,000)를 초과했습니다"), Idempotency-Key 없음
        '401':
          $ref: '#/components/responses/Error'
          description: "COMMON_UNAUTHORIZED — 인증 헤더 없음"
        '403':
          $ref: '#/components/responses/Error'
          description: "COMMON_FORBIDDEN — ADMIN 권한 아님"
        '404':
          $ref: '#/components/responses/Error'
          description: |
            COMMON_NOT_FOUND — 존재하지 않는 memberId
            WALLET_NOT_FOUND — 대상 회원의 지갑 미연결, 또는 등록되지 않은 address
        '409':
          $ref: '#/components/responses/Error'
          description: |
            COMMON_CONFLICT — 같은 멱등키에 다른 본문, 대상 지갑이 SUSPENDED
            COIN_RESERVE_MISMATCH — [v5] 발행량 대사 불일치로 mint 중단 상태(전용 코드 COIN_SUPPLY_MISMATCH는 §16.1)
        '429':
          $ref: '#/components/responses/Error'
          description: "COMMON_TOO_MANY_REQUESTS — 관리자당 30회/분 초과"
        '500':
          $ref: '#/components/responses/Error'
          description: "COIN_MINT_FAILED — mint tx 최종 실패 — 운영자 알림, 재시도는 새 멱등키로"

    get:
      operationId: coin_08
      tags: [coin]
      x-priority: P0
      x-screens: [M-03]
      x-features: [F-coin-10]
      x-role: ADMIN
      summary: 시연용 코인 지급 이력
      description: >-
        지급 이력을 최신순으로 준다. 원본은 chain_job WHERE tx_type='MINT'이며 별도 이력 테이블이 없다.
        가입 자동 지급(requester_member_id IS NULL → SIGNUP)과 관리자 수동 지급(ADMIN)이 한 목록에 섞여 나온다.
        합계 요약(summary)을 함께 주며 V-02의 totalSupply와 이 합계(grantedTotal)가 일치해야 한다(불변식 1).
        대상 회원의 지갑 주소는 관리자 화면이므로 노출한다.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: source
          in: query
          required: false
          schema:
            type: string
            enum: [SIGNUP, ADMIN]
          description: 미지정 시 전체
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [PENDING, SUBMITTED, CONFIRMED, FAILED]
        - name: memberId
          in: query
          required: false
          schema: { type: integer }

paths:
  /api/v1/admin/disputes:
    get:
      operationId: admin_09
      tags: [admin]
      summary: 이의제기 목록
      description: >
        관리자가 처리 대기 중인 이의를 찾아 들어가는 진입점이다. 기본 정렬은 미처리 우선·오래된 순
        (status=OPEN → createdAt,asc)이며 release 보류를 풀어야 하는 건이 위로 온다. 이의 본문·제출 팀·대상
        공연·정산 상태·이의제기 마감 시각을 담아 우선순위를 판단하게 하고, 관객 개인정보는 담지 않는다.
      x-priority: P0
      x-role: [ADMIN]
      x-screens: [M-02]
      x-features: [F-admin-09]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [OPEN, RESOLVED, REJECTED] }
          description: 미지정 시 전체
        - name: performanceId
          in: query
          required: false
          schema: { type: integer, format: int64 }
          description: 특정 공연으로 좁히기
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: sort
          in: query
          required: false
          schema: { type: string, enum: [createdAt, disputeClosesAt], default: createdAt }
          description: "OPEN 우선 정렬을 위한 기본값은 createdAt,asc"
      responses:
        '200':
          description: 이의제기 목록 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          summary:
                            $ref: '#/components/schemas/DisputeAdminListSummary'
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/DisputeAdminListItem'
                          pageInfo:
                            $ref: '#/components/schemas/PageMeta'
              examples:
                default:
                  value:
                    code: SUCCESS
                    data:
                      summary: { openCount: 2, releaseHeldCount: 1 }
                      items:
                        - { disputeId: 41, performanceId: 12, performanceTitle: 합정 3밴드 합동공연, teamId: 11, teamName: 노이즈캔슬, status: OPEN, reason: 관객 선택 집계가 현장 카운트와 다릅니다., expectedAmount: 320000, currency: KRW, settlementStatus: DISPUTE_OPEN, disputeClosesAt: '2026-09-22T18:00:00+09:00', releaseHeld: true, createdAt: '2026-09-21T09:12:00+09:00', resolvedAt: null }
                      pageInfo: { page: 0, size: 20, totalElements: 2, hasNext: false }
                    msg: ''
        '400':
          $ref: '#/components/responses/Error'
          description: |
            COMMON_VALIDATION_FAILED — 허용되지 않는 status·sort, size 100 초과
        '401':
          $ref: '#/components/responses/Error'
          description: |
            COMMON_UNAUTHORIZED — 인증 헤더 없음
        '403':
          $ref: '#/components/responses/Error'
          description: |
            COMMON_FORBIDDEN — ADMIN이 아님

  /api/v1/admin/disputes/{disputeId}:
    patch:
      operationId: admin_06
      tags: [admin]
      summary: 이의제기 처리
      description: >
        열린 이의를 RESOLVED 또는 REJECTED로 처리한다. REJECTED면 release 보류가 풀려 자동 스케줄이 재개된다.
        RESOLVED(이의 인정)면 정산 잠금이 이미 온체인에 확정돼 재집계가 불가능하므로, 관리자는 분배 결과를
        그대로 두고 release를 진행하거나(별도 API-settlement-05) 집계를 되돌릴 수 없다고 판정해 전액 환불을
        결정하고 정산을 HALTED로 전이하는(API-performance-12) 두 갈래 중 하나를 택한다 — 이 API 자체는 온체인
        tx를 만들지 않고 이의 상태만 바꾼다. AGGREGATED로 되돌리는 경로는 없다.
      x-priority: P0
      x-role: [ADMIN]
      x-screens: [M-02]
      x-features: [F-admin-06]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: disputeId
          in: path
          required: true
          schema: { type: integer, format: int64 }
          description: 이의제기 PK
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisputeResolveRequest'
            examples:
              default:
                value: { status: REJECTED, adminComment: 온체인 카운터와 서버 집계가 일치하며 재확인 결과 이상이 없어 기각합니다. }
      responses:
        '200':
          description: 이의제기 처리 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DisputeResolveResult'
              examples:
                default:
                  value:
                    code: SUCCESS
                    data: { disputeId: 41, performanceId: 12, teamId: 11, status: REJECTED, releaseHeld: false, resolvedAt: '2026-09-22T17:40:00+09:00' }
                    msg: 이의제기를 처리했습니다.
        '400':
          $ref: '#/components/responses/Error'
          description: |
            COMMON_VALIDATION_FAILED — 허용되지 않는 status, 사유 길이 위반
        '403':
          $ref: '#/components/responses/Error'
          description: |
            COMMON_FORBIDDEN — ADMIN이 아님
        '404':
          $ref: '#/components/responses/Error'
          description: |
            COMMON_NOT_FOUND — 존재하지 않는 disputeId
        '409':
          $ref: '#/components/responses/Error'
          description: |
            COMMON_CONFLICT — 이미 처리된 이의
            SETTLEMENT_ALREADY_RELEASED — 해당 정산이 이미 release 완료

components:
  schemas:
    DisputeAdminListSummary:
      type: object
      required: [openCount, releaseHeldCount]
      properties:
        openCount: { type: integer }
        releaseHeldCount:
          type: integer
          description: release가 보류된 정산 수

    DisputeAdminListItem:
      type: object
      required: [releaseHeld]
      properties:
        disputeId: { type: integer, format: int64 }
        performanceId: { type: integer, format: int64 }
        performanceTitle: { type: string }
        teamId: { type: integer, format: int64 }
        teamName: { type: string }
        status:
          type: string
          enum: [OPEN, RESOLVED, REJECTED]
        reason: { type: string }
        expectedAmount: { type: integer, nullable: true }
        currency: { type: string, enum: [KRW] }
        settlementStatus:
          type: string
          enum: [NONE, AGGREGATED, LOCKED, DISPUTE_OPEN, RELEASED, HALTED]
        disputeClosesAt: { type: string, format: date-time }
        releaseHeld: { type: boolean }
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time, nullable: true }

    DisputeResolveRequest:
      type: object
      required: [status, adminComment]
      properties:
        status:
          type: string
          enum: [RESOLVED, REJECTED]
        adminComment:
          type: string
          minLength: 10
          maxLength: 1000
          description: 처리 사유 — 참여팀에 공개

    DisputeResolveResult:
      type: object
      required: [releaseHeld]
      properties:
        disputeId: { type: integer, format: int64 }
        performanceId: { type: integer, format: int64 }
        teamId: { type: integer, format: int64 }
        status:
          type: string
          enum: [RESOLVED, REJECTED]
        releaseHeld: { type: boolean }
        resolvedAt: { type: string, format: date-time }

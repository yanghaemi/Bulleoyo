# 2026-09-08: 코인 개명 KRWS -> YoYo (name·symbol "YoYo", 로직 불변)
paths:
  /api/v1/performances/{performanceId}/rules:
    put:
      operationId: rule_01
      tags: [rule]
      summary: 정산 규칙 설정
      description: >
        2단계 비율 구조(1단계 fixedRatioBp + selectionRatioBp = 10000, 2단계 teamShares 합 10000)로 정산
        규칙을 저장한다. [2026-09-10] 온체인 공연이 이미 등록돼 있으면 RevenueSplitter.updateRules 를
        보내는 OPERATOR job(tx_type=UPDATE_RULES)을 함께 건다 — 서버에서만 바꾸면 두 해시가 갈려
        참여팀의 agreeToRules 가 RulesHashMismatch 로 revert 한다. 응답에 job id 는 담지 않는다(진행
        상황은 rule-02 의 startSaleBlockedReason 으로 본다). [2026-09-09] 보증금 선행 조건은 없다 — createShow 가 rulesHash!=0 을 요구하고 deposit 이 createShow 를 요구해 순환이 되기 때문이다. 순서는 규칙 → createShow → 보증금 → 동의 → 판매 시작이며 보증금 검증은 판매 시작(rule-04)이 한다. 잘못된 상태면 PERFORMANCE_INVALID_STATUS(409)로
        막는다. 저장할 때마다 규칙 정규화 JSON의 keccak256 해시(rulesHash)를 재산출하고 기존 동의를 전부
        PENDING으로 초기화하며(진행 중 SIGNING job은 FAILED로 닫는다), 공연 상태를 DRAFT → PENDING_AGREEMENT로
        전이한다. 시뮬레이션(예상 분배액)을 응답 simulation으로 함께 준다.
      x-priority: P0
      x-role: 생성자
      x-screens: [P-05]
      x-features: [F-rule-01]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: performanceId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleSetRequest'
            examples:
              default:
                value:
                  fixedRatioBp: 6000
                  selectionRatioBp: 4000
                  teamShares:
                    - { teamId: 7, shareBp: 5000 }
                    - { teamId: 9, shareBp: 3000 }
                    - { teamId: 11, shareBp: 2000 }
                  simulationRevenue: 1600000
      responses:
        '200':
          description: 저장된 정산 규칙과 시뮬레이션
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RuleSetResponseData'
              examples:
                default:
                  value:
                    code: SUCCESS
                    data:
                      performanceId: 12
                      status: PENDING_AGREEMENT
                      depositStatus: PAID
                      fixedRatioBp: 6000
                      selectionRatioBp: 4000
                      teamShares:
                        - { teamId: 7, shareBp: 5000 }
                        - { teamId: 9, shareBp: 3000 }
                        - { teamId: 11, shareBp: 2000 }
                      rulesHash: '0x4d1c8f7a2b9e0d3f6a5c8b1e4d7f0a3c6b9e2d5f8a1c4b7e0d3f6a9c2b5e8d1f'
                      agreementsReset: true
                      rate: { currency: USD, rate: 1350.0, asOf: '2026-09-02T09:00:00+09:00' }
                      simulation:
                        assumedRevenueAmount: 1600000
                        distributableAmount: 1600000
                        currency: KRW
                        dustTeamId: 7
                        shares:
                          - { teamId: 7, teamName: 블루노트, amount: 641668 }
                          - { teamId: 9, teamName: 새벽세시, amount: 529166 }
                          - { teamId: 11, teamName: 노이즈캔슬, amount: 429166 }
                      nextAction: COLLECT_AGREEMENTS
                    msg: 정산 규칙이 저장되었습니다. 참여팀 동의를 받아 주세요.
        '400':
          $ref: '#/components/responses/Error'
          description: |
            COMMON_VALIDATION_FAILED — bp 범위 위반, 삭제된 필드(equalRatioBp·commonCost·plannerRatioBp) 전달, teamShares의 팀이 참여팀이 아님
            RULE_RATIO_SUM_INVALID — 1단계 또는 2단계 합이 10000이 아님
        '403':
          $ref: '#/components/responses/Error'
          description: |
            PERFORMANCE_NOT_OWNER — 생성자 팀 리더가 아님
        '404':
          $ref: '#/components/responses/Error'
          description: |
            PERFORMANCE_NOT_FOUND — 존재하지 않는 performanceId
        '409':
          $ref: '#/components/responses/Error'
          description: |
            PERFORMANCE_INVALID_STATUS — 공연 상태가 DRAFT·PENDING_AGREEMENT 가 아님
            RULE_ALREADY_LOCKED — 판매 시작 이후 수정 시도
            RULE_SYNC_IN_PROGRESS — [2026-09-10] createShow 또는 startSale 이 전송 중(PENDING·SUBMITTED).
              기다리면 풀린다. createShow 창에서 막는 것은 해시가 바뀌는 저장뿐이고, startSale 창에서는
              같은 규칙 재저장도 막는다 — 저장이 서버 동의를 되돌리는데 온체인은 전원 동의한 채로
              영구히 잠긴다
    get:
      operationId: rule_02
      tags: [rule]
      summary: 규칙·동의 현황 조회
      description: >
        규칙 원문(두 비율 bp + teamShares)·rulesHash·잠금 여부와 팀별 동의 상태를 준다. 동의 상태는 PENDING /
        SIGNING(tx 보고 후 receipt 대기) / AGREED 3단계이며, 각 팀의 리더 지갑 주소와 동의 txHash·explorerUrl을
        함께 담는다. 내 팀의 다음 행동은 myAgreement.nextAction(SIGN/WAIT/NONE)이고, 판매 시작 가능 여부
        (startSaleAvailable)와 막힌 이유를 서버가 정해 내려준다.
        [2026-09-22] teamId 쿼리 추가 — 한 회원이 이 공연의 팀을 둘 이상 이끌 때 myAgreement 를 고정한다.
        생략하면 주최팀 우선 → teamId 오름차순의 첫 팀이며, myParticipatingTeams 로 전환 후보를 함께 준다.
        문서 개정 대상.
      x-priority: P0
      x-role: PERFORMER(참여팀)
      x-screens: [P-05, P-06]
      x-features: [F-rule-02]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: performanceId
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: teamId
          in: query
          required: false
          description: >
            myAgreement 를 고정할 팀. 요청자가 리더이고 이 공연의 참여팀이어야 한다(아니면 COMMON_FORBIDDEN).
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 규칙·동의 현황
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RuleStatusResponseData'
              examples:
                default:
                  value:
                    code: SUCCESS
                    data:
                      performanceId: 12
                      performanceStatus: PENDING_AGREEMENT
                      depositStatus: PAID
                      locked: false
                      rulesHash: '0x4d1c8f7a2b9e0d3f6a5c8b1e4d7f0a3c6b9e2d5f8a1c4b7e0d3f6a9c2b5e8d1f'
                      rule:
                        fixedRatioBp: 6000
                        selectionRatioBp: 4000
                        teamShares:
                          - { teamId: 7, shareBp: 5000 }
                          - { teamId: 9, shareBp: 3000 }
                          - { teamId: 11, shareBp: 2000 }
                      agreements:
                        - teamId: 7
                          teamName: 블루노트
                          walletAddress: '0x7a3f9c1d2e4b5a6c8d0e1f2a3b4c5d6e7f809a1b'
                          status: AGREED
                          txHash: '0x1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f901'
                          explorerUrl: https://kairos.kaiascan.io/tx/0x1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f901
                          agreedAt: '2026-09-03T10:02:00+09:00'
                        - teamId: 9
                          teamName: 새벽세시
                          walletAddress: '0x3c8a1f2b4d6e8091a2b3c4d5e6f708192a3b4c5d'
                          status: SIGNING
                          txHash: '0x2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f90112'
                          explorerUrl: https://kairos.kaiascan.io/tx/0x2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f90112
                          agreedAt: null
                        - teamId: 11
                          teamName: 노이즈캔슬
                          walletAddress: '0x9e0d1f2a3b4c5d6e7f8091a2b3c4d5e6f7081920'
                          status: PENDING
                          txHash: null
                          explorerUrl: null
                          agreedAt: null
                      myAgreement: { teamId: 11, status: PENDING, nextAction: SIGN }
                      startSaleAvailable: false
                      startSaleBlockedReason: RULE_NOT_AGREED_BY_ALL
                      myParticipatingTeams:
                        - { teamId: 11, teamName: 노이즈캔슬, host: false, agreementStatus: PENDING }
                    msg: ''
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
          description: |
            SETTLEMENT_NOT_PARTICIPANT — 참여팀 소속이 아님
            COMMON_FORBIDDEN — teamId 가 요청자의 팀이 아니거나 이 공연의 참여팀이 아님
        '404':
          $ref: '#/components/responses/Error'
          description: |
            PERFORMANCE_NOT_FOUND — 존재하지 않는 performanceId
            COMMON_NOT_FOUND — 규칙이 아직 설정되지 않음(DRAFT)

  /api/v1/performances/{performanceId}/rules/agreements/prepare:
    post:
      operationId: rule_03
      tags: [rule]
      summary: 규칙 동의 서명 파라미터
      description: >
        참여팀 리더 지갑이 RevenueSplitter.agreeToRules(showId, rulesHash)에 직접 서명하도록 서명 파라미터를
        만들어 준다(§0.4). 요청 rulesHash가 서버 현재 해시와 다르면 RULE_HASH_MISMATCH(409)다. createShow가
        선행되어야 하며 미완이면 운영자 job을 걸고 prerequisiteJobId를 내려준다. signRequests는 1건(AGREE)이며
        자금 이동이 없어 approve가 필요 없다. 이미 온체인 동의가 있으면(agreedOf) DB만 AGREED로 동기화하고
        signRequests는 빈 배열로 내려간다.
      x-priority: P0
      x-role: 참여팀 리더
      x-screens: [P-06]
      x-features: [F-rule-03]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: performanceId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgreementPrepareRequest'
            examples:
              default:
                value: { teamId: 9, rulesHash: '0x4d1c8f7a2b9e0d3f6a5c8b1e4d7f0a3c6b9e2d5f8a1c4b7e0d3f6a9c2b5e8d1f' }
      responses:
        '200':
          description: 규칙 동의 서명 파라미터
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PrepareResponse'
                          - type: object
                            properties:
                              performanceId: { type: integer, format: int64 }
                              teamId: { type: integer, format: int64 }
                              rulesHash:
                                $ref: '#/components/schemas/TxHash'
                              prerequisiteJobId:
                                type: [string, 'null']
                              stepUpRequired:
                                type: boolean
                                description: "[2026-09-24] 본인 확인 스위치(STEP_UP_ENABLED)가 켜졌을 때만 true. 꺼져 있으면 키가 없다(전역 non_null). 화면은 이 값으로 동의 서명 직전에 본인 확인 단계를 넣는다(범위 RULE_AGREE·공연)"
              examples:
                default:
                  value:
                    code: SUCCESS
                    data:
                      performanceId: 12
                      teamId: 9
                      rulesHash: '0x4d1c8f7a2b9e0d3f6a5c8b1e4d7f0a3c6b9e2d5f8a1c4b7e0d3f6a9c2b5e8d1f'
                      prerequisiteJobId: null
                      signRequests:
                        - kind: AGREE
                          required: true
                          to: '0xa1b2c3d4e5f60718293a4b5c6d7e8f9012345678'
                          data: '0x8f4ffcb1...'
                          value: '0x0'
                          chainId: '0x3e9'
                          gas: '0x186a0'
                          txType: FEE_DELEGATED_SMART_CONTRACT_EXECUTION
                          feePayer: '0x9f8e7d6c5b4a39281706f5e4d3c2b1a098765432'
                          summary:
                            title: Agree to the settlement rules
                            performanceId: 12
                            teamName: 새벽세시
                            fixedRatioBp: 6000
                            selectionRatioBp: 4000
                            myShareBp: 3000
                            rulesHash: '0x4d1c8f7a2b9e0d3f6a5c8b1e4d7f0a3c6b9e2d5f8a1c4b7e0d3f6a9c2b5e8d1f'
                      expiresAt: '2026-09-03T10:30:00+09:00'
                    msg: ''
        '400':
          $ref: '#/components/responses/Error'
          description: |
            COMMON_VALIDATION_FAILED — rulesHash 형식 위반(66자 아님)
        '403':
          $ref: '#/components/responses/Error'
          description: |
            COMMON_FORBIDDEN — 해당 팀 리더가 아님
            SETTLEMENT_NOT_PARTICIPANT — 참여팀이 아닌 팀으로 동의 시도
        '404':
          $ref: '#/components/responses/Error'
          description: |
            PERFORMANCE_NOT_FOUND — 존재하지 않는 performanceId
            WALLET_NOT_FOUND — 리더 지갑 미연결
        '409':
          $ref: '#/components/responses/Error'
          description: |
            RULE_HASH_MISMATCH — 요청 해시 ≠ 서버 현재 해시
            RULE_ALREADY_LOCKED — 이미 startSale 완료
            COMMON_CONFLICT — 내 팀 동의가 이미 SIGNING·AGREED
            RULE_SYNC_IN_PROGRESS — [2026-09-10] DB 해시와 온체인 해시가 갈려 있음(UPDATE_RULES
              미확정·실패·다른 해시 겨냥). 이 상태로 서명하면 agreeToRules 가 RulesHashMismatch 로
              revert 해 가스만 태운다
        '502':
          $ref: '#/components/responses/Error'
          description: |
            COMMON_EXTERNAL_SERVICE_ERROR — 체인 조회 실패로 서명 파라미터를 만들 수 없음

  /api/v1/performances/{performanceId}/rules/agreements/signed-tx:
    post:
      operationId: rule_05
      tags: [rule]
      summary: 규칙 동의 tx 해시 보고
      description: >
        리더가 서명·전송한 agreeToRules tx의 발신자 서명 RLP를 보고한다. 서버는 202 + jobId(signerType=USER)를
        주고 receipt와 동의 이벤트를 검증한다(§0.4). 보고 즉시 rule_agreement가 PENDING → SIGNING, receipt
        확정 시 → AGREED로 전이하며, 검증 실패는 PENDING으로 되돌리고 chain_job을 FAILED로 고정한다. 마지막
        검증 항목인 rulesHash가 서버 현재 해시와 다르면 RULE_HASH_MISMATCH(409)다. 전 참여팀이 AGREED가 되면
        응답에 allAgreed: true·startSaleAvailable: true가 내려간다. 같은 RLP 재보고는 최초 jobId를 재생하지만,
        규칙 동기화 중(UPDATE_RULES 미확정·실패)에는 같은 RLP 재보고도 RULE_SYNC_IN_PROGRESS(409)이며 기존 job
        멱등 응답을 주지 않는다(동기화 판정이 재생 판정보다 앞이다).
      x-priority: P0
      x-role: 참여팀 리더
      x-screens: [P-06]
      x-features: [F-rule-03, F-wallet-06]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: X-Step-Up-Token
          in: header
          required: false
          schema: { type: string, maxLength: 128 }
          description: "[2026-09-24] 본인 확인 토큰(webauthn_04, 범위 RULE_AGREE·공연). 서버 스위치 STEP_UP_ENABLED 가 켜져 있으면 필수 — 없거나 만료·소비·다른 동작/대상/회원의 토큰이면 403 WEBAUTHN_STEP_UP_REQUIRED. 권한·소유 검사가 먼저 돈다. 꺼져 있으면 읽지 않는다"
        - name: performanceId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/SignedTxRequest'
                - type: object
                  required: [teamId]
                  properties:
                    teamId: { type: integer, format: int64, description: 요청자가 리더인 참여팀. 동의한 팀 }
            examples:
              default:
                value: { teamId: 9, kind: AGREE, senderSignedRlp: '0x31f8b2a4c6d8e0f1a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f7081' }
      responses:
        '202':
          description: >
            대납 서명·전송 접수. receipt 검증(§0.4) 후 CONFIRMED 시 rule_agreement=AGREED로 전이한다.
            [2026-09-16 — S15P21B204-92] 공용 ChainJobAccepted 를 참조하던 것을 AgreeSignedTxResponse
            실제 12필드로 바꿨다.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [jobId, status, signerType, pollAfterMs, performanceId, teamId, agreementStatus, allAgreed, pendingTeamIds, startSaleAvailable]
                        properties:
                          jobId: { type: string }
                          status: { type: string, enum: [PENDING, SUBMITTED, CONFIRMED, FAILED] }
                          signerType: { type: string, enum: [OPERATOR, USER] }
                          pollAfterMs: { type: integer, default: 1500 }
                          performanceId: { type: integer, format: int64 }
                          teamId: { type: integer, format: int64 }
                          agreementStatus: { type: string, enum: [PENDING, SIGNING, AGREED] }
                          txHash:
                            allOf: [{ $ref: '#/components/schemas/TxHash' }]
                            description: 전송 전이면 키가 없다(non_null 직렬화).
                          explorerUrl:
                            type: string
                            format: uri
                            description: txHash 가 없으면 이 키도 없다.
                          allAgreed: { type: boolean }
                          pendingTeamIds:
                            type: array
                            description: 아직 AGREED 가 아닌 팀. 빈 배열은 전원 동의다(키는 항상 있다).
                            items: { type: integer, format: int64 }
                          startSaleAvailable:
                            type: boolean
                            description: true 면 API-rule-04 를 바로 부를 수 있다.
              examples:
                default:
                  value:
                    code: SUCCESS
                    data:
                      jobId: chain_01J9GB3C4D
                      status: SUBMITTED
                      signerType: USER
                      pollAfterMs: 1500
                      performanceId: 12
                      teamId: 9
                      agreementStatus: SIGNING
                      txHash: '0x2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f90112'
                      explorerUrl: https://kairos.kaiascan.io/tx/0x2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f90112
                      allAgreed: false
                      pendingTeamIds: [11]
                      startSaleAvailable: false
                    msg: 동의 트랜잭션을 확인하고 있습니다.
        '400':
          $ref: '#/components/responses/Error'
          description: |
            COMMON_VALIDATION_FAILED — RLP 형식 위반·디코드 실패, teamId 누락
        '403':
          $ref: '#/components/responses/Error'
          description: |
            COMMON_FORBIDDEN — 해당 팀 리더가 아님
            WEBAUTHN_STEP_UP_REQUIRED — [2026-09-24] 스위치 켜짐 + X-Step-Up-Token 없음·만료·소비·범위(RULE_AGREE·공연) 불일치
        '404':
          $ref: '#/components/responses/Error'
          description: |
            PERFORMANCE_NOT_FOUND — 존재하지 않는 performanceId
            COMMON_NOT_FOUND — prepare 발의 기록이 없음(순서 위반)
        '409':
          $ref: '#/components/responses/Error'
          description: |
            RULE_HASH_MISMATCH — tx의 rulesHash ≠ 서버 현재 해시
            RULE_ALREADY_LOCKED — 이미 startSale 완료
            COMMON_CONFLICT — 이미 AGREED, 또는 같은 RLP가 다른 팀으로 보고됨
            PAYMENT_AMOUNT_MISMATCH — receipt·이벤트 검증 실패(to·from·showId·이벤트 부재)
            RULE_SYNC_IN_PROGRESS — [2026-09-10] DB 해시와 온체인 해시가 갈려 있음. rule-03 과 같은
              판정이다 — 이미 서명을 손에 쥔 클라이언트도 게이트를 건너뛰지 못한다. 막지 않으면 대납
              전송 뒤 온체인에서 AlreadyAgreed 로 revert 한다(UPDATE_RULES 확정 뒤 재시도는 성공)
        '500':
          $ref: '#/components/responses/Error'
          description: |
            CHAIN_GAS_INSUFFICIENT — 운영지갑(fee payer) 잔액 부족으로 대납 전송 불가 — 운영자 알림 대상
        '504':
          $ref: '#/components/responses/Error'
          description: |
            CHAIN_TX_TIMEOUT — 확정이 120초를 넘김 — jobId로 계속 폴링

  /api/v1/performances/{performanceId}/sale/start:
    post:
      operationId: rule_04
      tags: [rule]
      summary: 판매 시작(startSale 잠금)
      description: >
        전 참여팀이 AGREED여야 실행되며 하나라도 PENDING·SIGNING이면 RULE_NOT_AGREED_BY_ALL이다. 운영자가
        RevenueSplitter.startSale(showId)로 one-way locked=true를 걸고, createShow가 미완이면 이 API가
        먼저 순차 실행한다. createShow 시점의 각 팀 리더 지갑 주소가 performance_participant.wallet_address에
        스냅샷으로 고정된다. 202 + jobId이며 tx 확정 시 공연이 PENDING_AGREEMENT → ON_SALE이 되어 예매를 받는다.
      x-priority: P0
      x-role: 생성자
      x-screens: [P-06]
      x-features: [F-rule-04]
      security:
        - bearerAuth: []
      parameters:
        - name: performanceId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaleStartRequest'
            examples:
              default:
                value: { rulesHash: '0x4d1c8f7a2b9e0d3f6a5c8b1e4d7f0a3c6b9e2d5f8a1c4b7e0d3f6a9c2b5e8d1f' }
      responses:
        '202':
          description: >
            [2026-09-10 — S15P21B204-67] 공용 ChainJobAccepted 를 참조하던 것을 실제 응답 shape 로 바꿨다.
            그 스키마는 jobId 를 필수 문자열로 정의하는데, createShow 가 아직 CONFIRMED 가 아니면
            이 API 는 START_SALE job 을 만들지 않고 jobId 를 null 로, prerequisiteJobId 에 createShow
            job 을 담아 돌려준다(둘이 동시에 PENDING 이면 워커가 startSale 을 먼저 보내 revert 한다).
            teamIndex 는 purchase(...) 의 인자이자 온체인 선택 카운터의 키이며 이후 바뀌지 않는다.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [status, pollAfterMs, performanceId]
                        properties:
                          jobId:
                            type: [string, 'null']
                            description: START_SALE job. createShow 미확정이면 null 이다.
                          prerequisiteJobId:
                            type: [string, 'null']
                            description: 선행 createShow job. 확정 뒤 다시 호출하면 null 이다.
                          status: { type: string, enum: [PENDING, SUBMITTED, CONFIRMED, FAILED] }
                          signerType: { type: string, enum: [OPERATOR, USER] }
                          pollAfterMs: { type: integer, default: 2000 }
                          performanceId: { type: integer, format: int64 }
                          nextStatus: { type: string, description: 확정 시 공연 상태. ON_SALE }
                          splitterAddress: { type: string }
                          teamWallets:
                            type: array
                            description: createShow job 을 만들 때 굳은 순서. 배열 인덱스 = teamIndex.
                            items:
                              type: object
                              properties:
                                teamId: { type: integer, format: int64 }
                                teamIndex: { type: integer }
                                walletAddress: { type: string }
              examples:
                default:
                  value:
                    code: SUCCESS
                    data:
                      jobId: chain_01J9B7D8E9
                      prerequisiteJobId: null
                      status: PENDING
                      signerType: OPERATOR
                      pollAfterMs: 2000
                      performanceId: 12
                      nextStatus: ON_SALE
                      splitterAddress: '0xa1b2c3d4e5f60718293a4b5c6d7e8f9012345678'
                      teamWallets:
                        - { teamId: 7, teamIndex: 0, walletAddress: '0x7a3f9c1d2e4b5a6c8d0e1f2a3b4c5d6e7f809a1b' }
                        - { teamId: 9, teamIndex: 1, walletAddress: '0x3c8a1f2b4d6e8091a2b3c4d5e6f708192a3b4c5d' }
                        - { teamId: 11, teamIndex: 2, walletAddress: '0x9e0d1f2a3b4c5d6e7f8091a2b3c4d5e6f7081920' }
                    msg: 판매 시작 트랜잭션을 전송했습니다. 확정되면 예매가 열립니다.
        '400':
          $ref: '#/components/responses/Error'
          description: |
            COMMON_VALIDATION_FAILED — rulesHash 형식 위반, 티켓 옵션 없음
        '403':
          $ref: '#/components/responses/Error'
          description: |
            PERFORMANCE_NOT_OWNER — 생성자 팀 리더가 아님
        '404':
          $ref: '#/components/responses/Error'
          description: |
            PERFORMANCE_NOT_FOUND — 존재하지 않는 performanceId
        '409':
          $ref: '#/components/responses/Error'
          description: |
            RULE_NOT_AGREED_BY_ALL — PENDING·SIGNING 팀 존재
            RULE_HASH_MISMATCH — 요청 해시 ≠ 서버 현재 해시
            RULE_ALREADY_LOCKED — 이미 잠금 완료
            TEAM_MIN_COUNT_NOT_MET — 공동 공연인데 참여팀 2팀 미만
            PERFORMANCE_INVALID_STATUS — DRAFT·CANCELLED, 또는 deposit_status가 PAID가 아님
            RULE_SYNC_IN_PROGRESS — [2026-09-10] DB 해시와 온체인 해시가 갈려 있음. 그대로 잠그면
              온체인이 옛 규칙으로 영구히 고정된다. 동의 준비(rule-03)와 같은 판정 하나를 본다
        '500':
          $ref: '#/components/responses/Error'
          description: |
            CHAIN_GAS_INSUFFICIENT — 운영지갑 가스 부족(관리자 알림 대상)
        '504':
          $ref: '#/components/responses/Error'
          description: |
            CHAIN_TX_TIMEOUT — 제출은 됐으나 확정 지연 — jobId로 계속 폴링

components:
  schemas:
    TeamShare:
      type: object
      required: [teamId, shareBp]
      properties:
        teamId: { type: integer, format: int64 }
        shareBp: { type: integer, minimum: 0, maximum: 10000, description: 고정 풀 내 팀별 비율(bp). 참여팀 합 10000 }
    RuleSetRequest:
      type: object
      required: [fixedRatioBp, selectionRatioBp, teamShares]
      properties:
        fixedRatioBp: { type: integer, minimum: 0, maximum: 10000, description: 고정 분배 전체 비율(bp) }
        selectionRatioBp: { type: integer, minimum: 0, maximum: 10000, description: 관객 선택 분배 비율(bp). fixedRatioBp와 합 10000 }
        teamShares:
          type: array
          description: 참여팀 수와 일치. shareBp 합 = 10000
          items:
            $ref: '#/components/schemas/TeamShare'
        simulationRevenue: { type: integer, minimum: 0, description: 시뮬레이션 가정 매출(YoYo 정수). 미지정 시 현재 매출 }
    RuleSet:
      type: object
      properties:
        fixedRatioBp: { type: integer }
        selectionRatioBp: { type: integer }
        teamShares:
          type: array
          items:
            $ref: '#/components/schemas/TeamShare'
    RuleSimulationShare:
      type: object
      properties:
        teamId: { type: integer, format: int64 }
        teamName: { type: string }
        amount: { type: integer }
    RuleSimulation:
      type: object
      properties:
        assumedRevenueAmount: { type: integer }
        distributableAmount: { type: integer }
        currency: { type: string }
        dustTeamId: { type: integer, format: int64, description: dust는 공연 생성 팀에 귀속 }
        shares:
          type: array
          items:
            $ref: '#/components/schemas/RuleSimulationShare'
    RuleSetResponseData:
      type: object
      required: [agreementsReset]
      properties:
        performanceId: { type: integer, format: int64 }
        status:
          $ref: '#/components/schemas/PerformanceStatus'
        depositStatus:
          $ref: '#/components/schemas/PerformanceDepositStatus'
        fixedRatioBp: { type: integer }
        selectionRatioBp: { type: integer }
        teamShares:
          type: array
          items:
            $ref: '#/components/schemas/TeamShare'
        rulesHash:
          $ref: '#/components/schemas/TxHash'
        agreementsReset: { type: boolean }
        rate:
          $ref: '#/components/schemas/RateBrief'
        simulation:
          $ref: '#/components/schemas/RuleSimulation'
        nextAction: { type: string, example: COLLECT_AGREEMENTS }
    RuleAgreementStatus:
      type: string
      enum: [PENDING, SIGNING, AGREED]
    RuleAgreementTeam:
      type: object
      properties:
        teamId: { type: integer, format: int64 }
        teamName: { type: string }
        walletAddress:
          $ref: '#/components/schemas/Address'
        status:
          $ref: '#/components/schemas/RuleAgreementStatus'
        txHash:
          type: [string, 'null']
        explorerUrl:
          type: [string, 'null']
        agreedAt:
          type: [string, 'null']
          format: date-time
    MyAgreement:
      type: object
      properties:
        teamId: { type: integer, format: int64 }
        status:
          $ref: '#/components/schemas/RuleAgreementStatus'
        nextAction:
          type: string
          enum: [SIGN, WAIT, NONE]
    RuleStatusResponseData:
      type: object
      required: [locked, startSaleAvailable]
      properties:
        performanceId: { type: integer, format: int64 }
        performanceStatus:
          $ref: '#/components/schemas/PerformanceStatus'
        depositStatus:
          $ref: '#/components/schemas/PerformanceDepositStatus'
        locked: { type: boolean }
        rulesHash:
          $ref: '#/components/schemas/TxHash'
        rule:
          $ref: '#/components/schemas/RuleSet'
        agreements:
          type: array
          items:
            $ref: '#/components/schemas/RuleAgreementTeam'
        myAgreement:
          $ref: '#/components/schemas/MyAgreement'
        startSaleAvailable: { type: boolean }
        startSaleBlockedReason:
          type: [string, 'null']
        myParticipatingTeams:
          type: array
          description: >
            요청자가 리더인 이 공연의 참여팀 전부. 주최팀 우선 → teamId 오름차순이며, teamId 쿼리를 주지 않으면
            myAgreement 가 이 배열의 첫 항목이다(API-performance-06과 같은 규칙).
          items:
            $ref: '#/components/schemas/MyTeamAgreement'
    MyTeamAgreement:
      type: object
      required: [host]
      properties:
        teamId: { type: integer, format: int64 }
        teamName: { type: string }
        host: { type: boolean }
        agreementStatus:
          $ref: '#/components/schemas/RuleAgreementStatus'
    AgreementPrepareRequest:
      type: object
      required: [teamId, rulesHash]
      properties:
        teamId: { type: integer, format: int64, description: 요청자가 리더인 참여팀. 동의하는 팀 }
        rulesHash:
          $ref: '#/components/schemas/TxHash'
    SaleStartRequest:
      type: object
      required: [rulesHash]
      properties:
        rulesHash:
          $ref: '#/components/schemas/TxHash'
          description: 잠글 규칙 해시. 서버 현재 해시와 일치해야 함

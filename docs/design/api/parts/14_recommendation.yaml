paths:
  /api/v1/recommendations/performances:
    get:
      operationId: recommendation_01
      tags: [recommendation]
      summary: 맞춤 추천 목록
      description: >-
        로그인 회원 홈 개인화 섹션(A-01 섹션 ④)에 노출할 맞춤 추천이다. ON_SALE 공연 중 회원이 PAID
        주문한 공연과 시작 시각이 지난 공연을 제외한 후보에서 선호 장르와 공연 장르(생성 팀 + REGISTERED
        이면서 지갑 등록을 수락한 참여 팀 장르 합집합 — 초대만 받고 미수락인 팀은 제외, 2차부터 LLM
        태그 장르 포함)의 겹침 수 내림차순·공연일 오름차순으로 최대 6건을 준다. 선호 0개거나 결과 0건이면
        곧 시작하는 순 폴백(basis=FALLBACK)이고, 6건 미만이면 폴백으로 채우되 basis는 GENRE를
        유지한다. 후보가 0건이면 items가 빈 배열이고 노출 로그를 기록하지 않는다. 노출 6건은 응답 후
        recommendation_log에 비동기로 기록하며 Redis 캐시는 쓰지 않는다.
      x-priority: P0
      x-role: MEMBER
      x-screens: [A-01]
      x-features: [F-recommendation-02]
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: 추천 목록 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RecommendationListResponse'
              examples:
                default:
                  value:
                    code: SUCCESS
                    data:
                      basis: GENRE
                      sessionId: 3f9a2c1e-7b3d-4e2a-9c1a-8d6b5a4f3e2d
                      rate: { currency: USD, rate: 1350.0, asOf: '2026-09-02T09:00:00+09:00' }
                      items:
                        - performanceId: 12
                          title: 합정 3밴드 합동공연
                          posterImageUrl: https://cdn.b204.ssafy.io/p/12.png
                          ticketImageUrl: https://cdn.b204.ssafy.io/t/12.png
                          venueName: 합정 언플러그드
                          startAt: '2026-09-19T19:00:00+09:00'
                          status: ON_SALE
                          minPriceAmount: 25000
                          currency: KRW
                          soldOut: false
                          teamNames: [블루노트, 새벽세시, 노이즈캔슬]
                          matchedGenres: [INDIE]
                    msg: ''
        '401':
          $ref: '#/components/responses/Error'
          description: |
            COMMON_UNAUTHORIZED — 인증 헤더 없음
            AUTH_TOKEN_EXPIRED — access token 만료 → API-member-03으로 재발급
            AUTH_TOKEN_INVALID — 서명 불일치·위조 토큰, 또는 토큰은 유효하나 회원 행이 없음

components:
  schemas:
    RecommendationItem:
      description: >-
        API-performance-02 목록 항목(PerformanceListItem)에 matchedGenres·reason을 더한
        추천 카드 1건.
      allOf:
        - $ref: '#/components/schemas/PerformanceListItem'
        - type: object
          required: [matchedGenres]
          properties:
            matchedGenres:
              type: array
              items:
                $ref: '#/components/schemas/Genre'
              description: 선호 장르와 겹친 코드. 폴백으로 채운 항목은 빈 배열.
            reason:
              type: [string, "null"]
              maxLength: 40
              description: >-
                추천 사유 한 줄(2차부터 생성). 2차 전엔 항상 null이며 전역 non_null 직렬화라
                값이 없을 때는 키 자체가 내려가지 않을 수 있다.

    RecommendationListResponse:
      type: object
      required: [basis, sessionId, items]
      properties:
        basis:
          type: string
          enum: [GENRE, TAGGED, RANKED, FALLBACK]
          description: >-
            GENRE=팀 장르만으로 매칭, TAGGED=LLM 태그 장르 덕에 매칭(2차), RANKED=CTR 랭커 재정렬(3차),
            FALLBACK=선호 0개 또는 결과 0건일 때 곧 시작하는 순.
        sessionId:
          type: string
          format: uuid
          description: 요청 1건 = 세션 1개. recommendation_log 조인 키.
        rate:
          $ref: '#/components/schemas/RateBrief'
          description: >-
            §0.5 축약형 표시 환율 — API-performance-02 와 같은 형태·같은 규칙(회원 표시 통화 기준).
            카드의 minPriceAmount 환산 근거다. 같은 화면의 공연 목록 응답에서 빌려 쓰지 않는다(목록이
            실패하면 추천 카드만 환산액이 빠진다).
        items:
          type: array
          maxItems: 6
          items:
            $ref: '#/components/schemas/RecommendationItem'

  /api/v1/performances/{performanceId}/settlement/approvals:
    post:
      operationId: settlement_08
      tags: [settlement]
      summary: 정산 조기 동의
      description: >
        [2026-09-21 신설] 참여팀 전원(주최팀 포함)이 동의하면 48시간 이의제기 기간을 건너뛰고 release가
        열린다. 요청 본문이 없다 — 동의 대상 팀은 요청자가 리더인 참여팀으로 서버가 정한다. ADMIN 우회가
        없다(dispute와 달리 남의 팀을 대신 동의할 수 없다). 동의는 되돌릴 수 없다. 온체인 작업이 아니므로
        동기 201로 응답한다. 이의제기 마감이 지난 뒤의 동의도 막지 않는다.
      x-priority: P0
      x-role: [PERFORMER]
      x-screens: [P-08]
      x-features: [F-settlement-08]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: X-Step-Up-Token
          in: header
          required: false
          schema: { type: string, maxLength: 128 }
          description: "[2026-09-24] 본인 확인 토큰(webauthn_04, 범위 SETTLEMENT_APPROVE·공연). 서버 스위치 STEP_UP_ENABLED 가 켜져 있으면 필수 — 없거나 만료·소비·다른 동작/대상/회원의 토큰이면 403 WEBAUTHN_STEP_UP_REQUIRED. 권한·소유 검사가 먼저 돈다. 동의 게이트(참여팀 리더·정산 상태)를 통과한 뒤 검사한다. 꺼져 있으면 읽지 않는다"
        - name: performanceId
          in: path
          required: true
          schema: { type: integer, format: int64 }
          description: 공연 PK
      responses:
        '201':
          description: 정산 동의 접수 성공(동기)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SettlementApproval'
              examples:
                default:
                  value:
                    code: SUCCESS
                    data: { teamId: 12, approvedAt: '2026-09-21T14:03:11+09:00', approvedCount: 2, requiredCount: 3, releaseUnlocked: false }
                    msg: 정산에 동의했습니다.
        '401':
          $ref: '#/components/responses/Error'
          description: |
            COMMON_UNAUTHORIZED — 비로그인
        '403':
          $ref: '#/components/responses/Error'
          description: |
            SETTLEMENT_NOT_PARTICIPANT — 참여팀이 아님(참여팀 아닌 ADMIN 포함, 리더가 아닌 팀원 포함)
            WEBAUTHN_STEP_UP_REQUIRED — [2026-09-24] 스위치 켜짐 + X-Step-Up-Token 없음·만료·소비·범위(SETTLEMENT_APPROVE·공연) 불일치
            -04와 달리 COMMON_FORBIDDEN 은 없다 — 본문이 없어 대상 팀을 요청자에서 찾고,
            팀 소속 테이블이 없어 참여팀의 리더가 곧 소속이다
        '404':
          $ref: '#/components/responses/Error'
          description: |
            PERFORMANCE_NOT_FOUND — 존재하지 않는 performanceId
        '409':
          $ref: '#/components/responses/Error'
          description: |
            SETTLEMENT_NOT_LOCKED — 정산이 NONE·AGGREGATED, 또는 요청자 팀의 분배 행이 없음
            SETTLEMENT_ALREADY_RELEASED — 정산이 RELEASED
            PERFORMANCE_INVALID_STATUS — 정산이 HALTED
            COMMON_CONFLICT — 이미 동의한 팀, 또는 그 팀에 열린 이의가 있음

components:
  schemas:
    SettlementRateSummary:
      type: object
      description: '§0.5 목록 축약형 환율 — 항목마다 display를 반복하지 않는다'
      properties:
        currency: { type: string }
        rate: { type: number }
        asOf: { type: string, format: date-time }

    SettlementActionState:
      type: object
      required: [available]
      properties:
        available: { type: boolean }
        blockedReason:
          type: string
          nullable: true
          description: |
            available=false일 때 막힌 이유. 실행 API가 그 상태에서 실제로 던지는 ErrorCode와 **같은 문자열**이다
            (서버가 실행·조회에 같은 게이트 `SettlementGates`를 쓴다). 안내 문구 매핑을 409 응답과 공유하면 된다.

    SettlementActions:
      type: object
      description: |
        단계별 액션 실행 가능 여부. 버튼 활성 조건을 서버가 정한다 — 프론트는 상태·이의·마감·대사를 다시 판정하지 않는다.

        **예외 2종(체인 조회가 필요한 검사)은 여기 반영되지 않는다** — 조회 한 번에 eth_call이 여러 번 붙는 것을 피한다.
        · aggregate: 서버 집계 ↔ 온체인 카운터 대사 → 실행 시 409 `SETTLEMENT_AGGREGATE_MISMATCH`
        · release: 실행 직전 에스크로 잔액 확인 → 실행 시 409 `COIN_ESCROW_INSUFFICIENT`
        즉 `available: true`인 버튼도 실행이 409로 끝날 수 있다. 화면은 409 응답의 `code`로 안내하는 경로를 반드시 둔다(2026-09-09, D-25).

        [2026-09-21] `approve`(정산 조기 동의, API-settlement-08)를 추가했다. 실행 API와 같은 게이트를
        그대로 부른다 — 이미 동의했거나 열린 이의가 있으면 `available: false`다.
      properties:
        aggregate: { $ref: '#/components/schemas/SettlementActionState' }
        lock: { $ref: '#/components/schemas/SettlementActionState' }
        dispute: { $ref: '#/components/schemas/SettlementActionState' }
        release: { $ref: '#/components/schemas/SettlementActionState' }
        approve: { $ref: '#/components/schemas/SettlementActionState' }

    SettlementShare:
      type: object
      required: [released]
      properties:
        teamId: { type: integer, format: int64 }
        teamName: { type: string }
        walletAddress: { $ref: '#/components/schemas/Address' }
        fixedAmount: { type: integer, description: '2단계 규칙의 고정 풀 분배액(teamShareBp로 배분, v3의 equalAmount 대체)' }
        choiceAmount: { type: integer }
        dustAmount: { type: integer }
        totalAmount: { type: integer }
        choiceCount: { type: integer }
        released: { type: boolean }
        releasedAt: { type: string, format: date-time, nullable: true }
        approved:
          type: boolean
          description: '[2026-09-21] 정산 조기 동의 여부(API-settlement-08)'
        approvedAt:
          type: string
          format: date-time
          nullable: true
          description: '[2026-09-21] 동의 시각. 미동의 팀은 non_null 직렬화로 필드째 빠진다'

    SettlementMyTeam:
      type: object
      required: [released]
      properties:
        teamId: { type: integer, format: int64 }
        totalAmount: { type: integer }
        released: { type: boolean }
        releasedAt: { type: string, format: date-time, nullable: true }
        walletAddress: { $ref: '#/components/schemas/Address' }
        nextAction:
          type: string
          enum: [NONE, WAIT_RELEASE]
          description: release 이후에는 팀이 할 일이 없어 값이 둘뿐이다
        approved:
          type: boolean
          description: '[2026-09-21] 내 팀의 정산 조기 동의 여부. 버튼 라벨만 바꾸고 활성 판단에는 쓰지 않는다(활성 판단은 actions.approve)'

    SettlementTransaction:
      type: object
      properties:
        type:
          type: string
          description: 'chain_job.tx_type과 같은 값(§0.3 14종 중 정산 관련: START_SALE·AGGREGATE·LOCK·RELEASE·HALT 등)'
          example: RELEASE
        txHash: { $ref: '#/components/schemas/TxHash' }
        explorerUrl: { type: string, format: uri }

    SettlementDeposit:
      type: object
      properties:
        status:
          type: string
          description: '보증금 상태. 문서 예시값은 RETURNED — 전체 enum은 performance/rule 도메인 소관'
          example: RETURNED
        amount: { type: integer }
        returnTxHash: { $ref: '#/components/schemas/TxHash' }
        returnedAt: { type: string, format: date-time, nullable: true }

    Settlement:
      type: object
      description: 정산 상태·집계·분배액 전체(API-settlement-01). 참여팀 전용
      required: [performanceId, settlementId, status, currency]
      properties:
        performanceId: { type: integer, format: int64 }
        settlementId: { type: integer, format: int64 }
        status:
          type: string
          enum: [NONE, AGGREGATED, LOCKED, DISPUTE_OPEN, RELEASED, HALTED]
        rate: { $ref: '#/components/schemas/SettlementRateSummary' }
        currency: { type: string, enum: [KRW] }
        grossRevenueAmount: { type: integer }
        refundedAmount: { type: integer }
        netRevenueAmount: { type: integer }
        distributableAmount: { type: integer }
        escrowBalanceAmount: { type: integer }
        fixedRatioBp: { type: integer, description: '고정 배분 비율(basis point, 10000=100%)' }
        selectionRatioBp: { type: integer, description: '선택 배분 비율(basis point)' }
        dustAmount: { type: integer, description: '나머지 배분(버림 오차). 생성 팀에 귀속' }
        dustTeamId: { type: integer, format: int64 }
        rulesHash: { $ref: '#/components/schemas/TxHash' }
        aggregatedAt: { type: string, format: date-time, nullable: true }
        lockedAt: { type: string, format: date-time, nullable: true }
        disputeClosesAt: { type: string, format: date-time, nullable: true }
        releasedAt: { type: string, format: date-time, nullable: true }
        releaseTxHash:
          oneOf:
            - $ref: '#/components/schemas/TxHash'
            - type: "null"
        counterMatched:
          type: boolean
          description: 온체인 선택 카운터 합과 서버 집계 일치 여부(REL-06)
        deposit: { $ref: '#/components/schemas/SettlementDeposit' }
        shares:
          type: array
          items: { $ref: '#/components/schemas/SettlementShare' }
        myTeam: { $ref: '#/components/schemas/SettlementMyTeam' }
        disputes:
          type: array
          items: { $ref: '#/components/schemas/Dispute' }
        transactions:
          type: array
          items: { $ref: '#/components/schemas/SettlementTransaction' }
        actions: { $ref: '#/components/schemas/SettlementActions' }
        stepUpRequired:
          type: boolean
          description: "[2026-09-24] 본인 확인 스위치(STEP_UP_ENABLED)가 켜졌을 때만 true — 조기 동의(settlement_08)·정산금 지급(settlement_05)이 X-Step-Up-Token 을 요구한다는 뜻(범위 SETTLEMENT_APPROVE / SETTLEMENT_RELEASE·공연). 꺼져 있으면 키가 없다(전역 non_null)"

    Dispute:
      type: object
      description: 정산 이의제기(팀 단위, member_id 없음)
      required: [releaseHeld]
      properties:
        disputeId: { type: integer, format: int64 }
        performanceId: { type: integer, format: int64 }
        teamId: { type: integer, format: int64 }
        status:
          type: string
          enum: [OPEN, RESOLVED, REJECTED]
        createdAt: { type: string, format: date-time }
        releaseHeld:
          type: boolean
          description: 이 이의로 release 자동 실행이 보류 중인지

    DisputeCreateRequest:
      type: object
      required: [teamId, reason]
      properties:
        teamId:
          type: integer
          format: int64
          description: 이의를 제기하는 팀. 요청자가 리더인 참여팀이어야 한다
        reason:
          type: string
          minLength: 10
          maxLength: 1000
        expectedAmount:
          type: integer
          minimum: 0
          description: 팀이 주장하는 정산액(참고용)

    SettlementReleaseRequest:
      type: object
      properties:
        note:
          type: string
          maxLength: 200
          description: 수동 실행 사유(감사 로그)

    SettlementApproval:
      type: object
      description: 정산 조기 동의 응답(API-settlement-08, 동기 201)
      required: [teamId, approvedAt, approvedCount, requiredCount, releaseUnlocked]
      properties:
        teamId: { type: integer, format: int64 }
        approvedAt: { type: string, format: date-time }
        approvedCount:
          type: integer
          description: 이번 동의를 포함해 동의한 팀 수
        requiredCount:
          type: integer
          description: 전체 settlement_share 행 수(= 참여팀 수)
        releaseUnlocked:
          type: boolean
          description: >
            이 동의로 전원이 찼는가. release의 나머지 게이트(열린 이의·발행량 대사·에스크로·수령 지갑)까지
            통과했다는 뜻은 아니다 — 그 답은 actions.release다.

    SettlementShareLinkResult:
      type: object
      properties:
        performanceId: { type: integer, format: int64 }
        shareUrl: { type: string, format: uri }
        shareToken: { type: string }
        issuedAt: { type: string, format: date-time }

    SettlementPublicShare:
      type: object
      required: [released]
      properties:
        teamName: { type: string }
        fixedAmount: { type: integer }
        choiceAmount: { type: integer }
        dustAmount: { type: integer }
        totalAmount: { type: integer }
        choiceCount: { type: integer }
        released: { type: boolean }

    SettlementPublic:
      type: object
      description: 정산 공유 링크의 공개 조회 응답(API-settlement-07). 관객 개인정보 없음, 팀 단위 집계만
      properties:
        performanceId: { type: integer, format: int64 }
        performanceTitle: { type: string }
        performedAt: { type: string, format: date-time }
        settlementStatus:
          type: string
          enum: [NONE, AGGREGATED, LOCKED, DISPUTE_OPEN, RELEASED, HALTED]
        rate: { $ref: '#/components/schemas/SettlementRateSummary' }
        currency: { type: string, enum: [KRW] }
        grossRevenueAmount: { type: integer }
        refundedAmount: { type: integer }
        netRevenueAmount: { type: integer }
        fixedRatioBp: { type: integer }
        selectionRatioBp: { type: integer }
        shares:
          type: array
          items: { $ref: '#/components/schemas/SettlementPublicShare' }
        releaseTxHash: { $ref: '#/components/schemas/TxHash' }
        explorerUrl: { type: string, format: uri }
        simulationNotice: { type: string }

                      approveJobId: null
                      payments:
                        - { orderId: 5501, paymentId: 8801, paymentStatus: AWAITING_SIGNATURE, amount: 25000, teamName: "새벽세시", purchaseJobId: null }
                        - { orderId: 5502, paymentId: 8802, paymentStatus: AWAITING_SIGNATURE, amount: 25000, teamName: "노을과기타", purchaseJobId: null }
                      paidCount: 0
                      totalCount: 2
                      amount: 50000
                      currency: KRW
                      display: { currency: USD, approx: 37.04, rate: 1350.0, asOf: "2026-09-02T09:00:00+09:00" }
                      walletBalance: 85000
                      shortfall: 0
                      signRequests:
                        - kind: APPROVE
                          required: true
                          txType: FEE_DELEGATED_SMART_CONTRACT_EXECUTION
                          to: "0x5f1e2d3c4b5a69788796a5b4c3d2e1f009182736"
                          data: "0x095ea7b3..."
                          value: "0x0"
                          chainId: "0x3e9"
                          gas: "0x11170"
                          feePayer: "0x9f8e7d6c5b4a39281706f5e4d3c2b1a098765432"
                          summary: { title: "Allow ticket payment", amount: 50000, currency: KRW, spender: RevenueSplitter, spenderAddress: "0xa1b2c3d4e5f60718293a4b5c6d7e8f9012345678" }
                        - kind: PURCHASE
                          required: true
                          txType: FEE_DELEGATED_SMART_CONTRACT_EXECUTION
                          to: "0xa1b2c3d4e5f60718293a4b5c6d7e8f9012345678"
                          data: "0x3d7403a3..."
                          value: "0x0"
                          chainId: "0x3e9"
                          gas: "0x30d40"
                          feePayer: "0x9f8e7d6c5b4a39281706f5e4d3c2b1a098765432"
                          summary: { orderId: 5501, title: "Confirm ₩25,000 payment", amount: 25000, currency: KRW, performanceId: 12, orderRef: "0x9a8b7c6d5e4f30211f2e3d4c5b6a798807162534435261708f9e0d1c2b3a4958", teamIndex: 1, teamName: "새벽세시" }
                        - kind: PURCHASE
                          required: true
                          txType: FEE_DELEGATED_SMART_CONTRACT_EXECUTION
                          to: "0xa1b2c3d4e5f60718293a4b5c6d7e8f9012345678"
                          data: "0x4e8514b4..."
                          value: "0x0"
                          chainId: "0x3e9"
                          gas: "0x30d40"
                          feePayer: "0x9f8e7d6c5b4a39281706f5e4d3c2b1a098765432"
                          summary: { orderId: 5502, title: "Confirm ₩25,000 payment", amount: 25000, currency: KRW, performanceId: 12, orderRef: "0x1c2b3a4958f6a9d8e7c6b5a49382716f5e4d3c2b1a09887766554433221100f", teamIndex: 2, teamName: "노을과기타" }
                      blockedReason: null
                      ticketIds: []
                      pollAfterMs: null
                      expiresAt: "2026-09-10T20:15:00+09:00"
                    msg: ""
                paid:

# 2026-09-08: 코인 개명 KRWS -> YoYo (name·symbol "YoYo", 로직 불변)
paths:
  /api/v1/orders/{orderId}/payment:
    post:
      operationId: payment_01
      tags: [payment]
      x-priority: P0
      x-screens: [A-05]
      x-features: [F-payment-01]
      x-role: "AUDIENCE(주문자)"
      summary: "결제 시작(잔액)"
      description: >-
        PENDING_PAYMENT(또는 PARTIALLY_PAID) 주문 그룹에 대해 결제를 시작한다. 결제 수단이 잔액 결제 하나이므로
        요청 본문이 없다(빈 객체 허용). [v6.2] 경로의 {orderId}는 그룹의 어느 하위 주문이든 되며, 서버가
        order_group_id로 그룹 전체를 찾는다. 서명·잔액 검사는 아직 결제되지 않은 하위 주문의 합계를 기준으로
        한다. 서버가 YoYo.balanceOf(관객 지갑)을 조회해 잔액 ≥ 미결제 합계이면 §0.4 서명 파라미터(APPROVE? + 미결제
        하위 주문마다 PURCHASE)를 내려주고 각 하위 주문의 payment를 AWAITING_SIGNATURE로 만든다. 잔액이 모자라면
        409 COMMON_CONFLICT이며 payment 레코드는 만들지 않고 주문은 그대로 둔다. 이 API는 §0.4 사용자 서명 tx
        규약(prepare 단계)의 대표 사례다. 서명 단계 카운터는 "1/3 → 2/3 → 3/3"처럼 표시한다(화면 v7.5).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: orderId
          in: path
          required: true
          schema: { type: integer, format: int64 }
          description: "주문 PK. v6.2 — 그룹의 어느 하위 주문이든 허용"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: "[v5] 본문 없음(빈 객체 {} 허용). 알 수 없는 필드(구 클라이언트의 mode 등)는 COMMON_VALIDATION_FAILED로 거부한다"
            examples:
              default:
                value: {}
      responses:
        '200':
          description: "서명 파라미터 발급 성공(잔액 충분)"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PaymentStartResult'
              examples:
                default:
                  value:
                    code: SUCCESS
                    data:
                      orderGroupId: 5501
                      approveJobId: null
                      payments:
                        - { orderId: 5501, paymentId: 8801, paymentStatus: AWAITING_SIGNATURE, amount: 25000, teamName: "새벽세시", purchaseJobId: null }
                        - { orderId: 5502, paymentId: 8802, paymentStatus: AWAITING_SIGNATURE, amount: 25000, teamName: "노을과기타", purchaseJobId: null }
                      amount: 50000
                      currency: KRW
                      display: { currency: USD, approx: 37.04, rate: 1350.0, asOf: "2026-09-02T09:00:00+09:00" }
                      walletBalance: 85000
                      signRequests:
                        - kind: APPROVE
                          required: false
                          txType: FEE_DELEGATED_SMART_CONTRACT_EXECUTION
                          to: "0x5f1e2d3c4b5a69788796a5b4c3d2e1f009182736"
                          data: "0x095ea7b3..."
                          value: "0x0"
                          chainId: "0x3e9"
                          gas: "0x11170"
                          feePayer: "0x9f8e7d6c5b4a39281706f5e4d3c2b1a098765432"
                          summary: { title: "Allow ticket payment", amount: 50000, currency: KRW, spender: RevenueSplitter, spenderAddress: "0xa1b2c3d4e5f60718293a4b5c6d7e8f9012345678" }
                        - kind: PURCHASE
                          required: true
                          txType: FEE_DELEGATED_SMART_CONTRACT_EXECUTION
                          to: "0xa1b2c3d4e5f60718293a4b5c6d7e8f9012345678"
                          data: "0x3d7403a3..."
                          value: "0x0"
                          chainId: "0x3e9"
                          gas: "0x30d40"
                          feePayer: "0x9f8e7d6c5b4a39281706f5e4d3c2b1a098765432"
                          summary: { orderId: 5501, title: "Confirm ₩25,000 payment", amount: 25000, currency: KRW, performanceId: 12, orderRef: "0x9a8b7c6d5e4f30211f2e3d4c5b6a798807162534435261708f9e0d1c2b3a4958", teamIndex: 1, teamName: "새벽세시" }
                        - kind: PURCHASE
                          required: true
                          txType: FEE_DELEGATED_SMART_CONTRACT_EXECUTION
                          to: "0xa1b2c3d4e5f60718293a4b5c6d7e8f9012345678"
                          data: "0x4e8514b4..."
                          value: "0x0"
                          chainId: "0x3e9"
                          gas: "0x30d40"
                          feePayer: "0x9f8e7d6c5b4a39281706f5e4d3c2b1a098765432"
                          summary: { orderId: 5502, title: "Confirm ₩25,000 payment", amount: 25000, currency: KRW, performanceId: 12, orderRef: "0x1c2b3a4958f6a9d8e7c6b5a49382716f5e4d3c2b1a09887766554433221100f", teamIndex: 2, teamName: "노을과기타" }
                      expiresAt: "2026-09-10T20:15:00+09:00"
                    msg: ""
        '400':
          $ref: '#/components/responses/Error'
          description: |
            COMMON_VALIDATION_FAILED — Idempotency-Key 없음, [v5] 알 수 없는 본문 필드(mode 등) 전달
        '401':
          $ref: '#/components/responses/Error'
          description: "COMMON_UNAUTHORIZED — 비로그인"
        '404':
          $ref: '#/components/responses/Error'
          description: |
            COMMON_NOT_FOUND — 존재하지 않는 주문 또는 타인 주문
            WALLET_NOT_FOUND — 지갑 미연결 회원
        '409':
          $ref: '#/components/responses/Error'
          description: |
            COMMON_CONFLICT — [v5] 지갑 YoYo 잔액 < 미결제 하위 주문 합계(예: "Insufficient balance · ₩15,000 short"처럼 msg에만 부족액 담김, data는 null. 전용 코드 PAYMENT_INSUFFICIENT_BALANCE는 규격 v5 신설 제안), 같은 멱등키에 다른 본문, 주문 만료, 이미 서명 대기 중인 결제 존재
            PAYMENT_ALREADY_PAID — 그룹 전체가 이미 결제 완료됨(더 결제할 하위 주문이 없음)
            TICKET_SALE_CLOSED — 결제 시도 시점에 예매 마감
        '502':
          $ref: '#/components/responses/Error'
          description: "COMMON_EXTERNAL_SERVICE_ERROR — 잔액·allowance 조회 실패(서명 파라미터를 만들 수 없음)"

    get:
      operationId: payment_02
      tags: [payment]
      x-priority: P0
      x-screens: [A-05]
      x-features: [F-payment-02]
      x-role: "AUDIENCE(주문자)"
      summary: 결제 상태 조회
      description: >-
        A-05의 처리 중 상태(폴링)에서 쓰는 조회다. [v6.2] 응답은 그룹 뷰다 — orderGroupId·groupStatus(§5-1 파생
        규칙)·approveJobId·payments[{orderId, paymentId, paymentStatus, amount, teamName, purchaseJobId}]·
        paidCount/totalCount를 담는다. [v6.2 변경] purchaseJobId는 하위 주문마다 다르므로 payments[].purchaseJobId로
        옮겼다. approveJobId는 그룹당 1건(미결제 합계에 대한 승인)이라 최상위에 그대로 둔다.
        payments[] 중 하나라도 paymentStatus=AWAITING_SIGNATURE이면 응답에 미결제분만 다시 담은 signRequests를
        함께 담아 별도 prepare 호출 없이 곧바로 서명을 요청할 수 있게 한다(원스텝 UX). 결제가 확정되면 발급된
        ticketIds를 함께 준다. signRequests는 매 호출마다 현재 allowance·잔액을 다시 반영해(미결제 하위 주문만)
        만들며, 잔액이 그 사이 줄었으면 blockedReason: INSUFFICIENT_BALANCE와 shortfall을 담고 signRequests를
        null로 준다. 하위 주문 일부만 PAID이고 나머지가 PENDING_PAYMENT이거나 CANCELLED면 groupStatus = PARTIALLY_PAID다.
        만료 전(15분 이내)에는 미결제분이 PENDING_PAYMENT로 남아 이 API 재호출로 재시도할 수 있고, 이때 expiresAt은
        null이 아니라 남은 시간을 담는다.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: orderId
          in: path
          required: true
          schema: { type: integer, format: int64 }
          description: "주문 PK. v6.2 — 그룹의 어느 하위 주문이든 허용"
      responses:
        '200':
          description: "결제 상태 조회 성공(서명 대기 / 완료 / 잔액 부족으로 서명 불가)"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PaymentStatusResult'

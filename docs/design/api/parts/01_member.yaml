          type: string
          format: date-time

    MemberUpdateRequest:
      type: object
      description: >-
        currentPassword·newPassword는 함께 있어야 하며 authProvider=LOCAL 회원만 사용할 수 있다.
        preferredGenres는 전달 시 전체 교체(빈 배열 = 모두 삭제)다. 그 외 필드는 전달된 것만 부분
        수정된다.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
        phone:
          type: string
          maxLength: 20
        countryCode:
          type: string
          pattern: '^[A-Z]{2}$'
        locale:
          type: string
          enum: [en, ko]
        displayCurrency:
          type: string
          pattern: '^[A-Z]{3}$'
        timezone:
          type: string
        preferredGenres:
          type: array
          maxItems: 3
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Genre'
          description: 선호 장르 전체 교체(v7 신설). 빈 배열 = 모두 삭제.
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8
          maxLength: 64


<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&display=swap">
  <style>
    :root{--ink:#17141f;--ink2:#3a3548;--muted:#6f6880;--line:#e3dfe9;--ground:#f5f3f7;--surface:#fff;
      --amber:#e39b2b;--amber-soft:#fbf1de;--amber-line:#efdcb8;--amber-deep:#8a5510;
      --ok:#2e7d5b;--ok-soft:#e4f1ea;--crit:#b3243c;--crit-soft:#fbe7ea;
      --ease-out:cubic-bezier(.23,1,.32,1);}
    *{box-sizing:border-box;}
    body{margin:0;background:var(--ground);color:var(--ink);
      font-family:Archivo,"Noto Sans KR",system-ui,sans-serif;font-size:14px;line-height:1.5;
      -webkit-font-smoothing:antialiased;}
    a{color:var(--amber-deep);text-decoration:none;} a:hover{color:#6b4009;}
    h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance;}
    .mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;}
    .eyebrow{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);}
    .card{background:var(--surface);border:1px solid var(--line);border-radius:10px;}
    .tap{transition:transform 160ms var(--ease-out);}
    .tap:active{transform:scale(.985);}
    .btn{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:8px;
      border:1px solid var(--ink);background:var(--ink);color:#fff;
      font:600 15px Archivo,"Noto Sans KR",sans-serif;transition:transform 160ms var(--ease-out);}
    .btn:active{transform:scale(.97);}
    .btn.ghost{background:var(--surface);color:var(--ink);}
    .btn.amber{background:var(--amber);border-color:var(--amber);color:#2a1b04;}
    .btn.off{background:var(--line);border-color:var(--line);color:#9b95a6;}
    .btn.off:active{transform:none;}
    @media (hover:hover) and (pointer:fine){
      .btn.ghost:hover{background:var(--ground);}
      .card.tap:hover{border-color:#cfc8da;}
    }
    @media (prefers-reduced-motion:reduce){ .tap,.btn{transition:none;} .tap:active,.btn:active{transform:none;} }
    .badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:5px;font-size:11px;font-weight:600;
      background:var(--amber-soft);color:var(--amber-deep);}
    .badge.ok{background:var(--ok-soft);color:var(--ok);}
    .badge.crit{background:var(--crit-soft);color:var(--crit);}
    .badge.plain{background:var(--ground);color:var(--muted);}
    .sub{color:var(--muted);font-size:12px;}
    .rule{height:1px;background:var(--line);}
    .poster{background:linear-gradient(160deg,#2c2540,#5d4a2e 70%,#8a6a2c);border-radius:8px;}
  </style>
</helmet>
<div style="min-height:100%;background:var(--ground);display:flex;flex-direction:column;">
  <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;background:var(--surface);border-bottom:1px solid var(--line);"><div style="font-weight:700;font-size:16px;">Choose tickets</div></div>
  <div style="padding:18px 20px;display:flex;flex-direction:column;gap:14px;">
    <div class="card" style="padding:13px;background:var(--amber-soft);border-color:var(--amber-line);">
      <div style="font-weight:600;margin-bottom:3px;">Booking closes at 6:00 PM KST on Sep 20.</div>
      <div class="sub">Free cancellation until Sep 17, 00:00 KST.</div></div>
    <div class="card" style="padding:13px;display:flex;justify-content:space-between;align-items:center;gap:12px;"><div style="min-width:0;"><div style="font-weight:600;">Early bird</div><div class="sub"><span class="mono">₩12,000</span> ≈ <span class="mono">$8.88</span> · 4 left</div></div><div style="display:flex;align-items:center;gap:10px;flex:none;"><div class="btn ghost" style="width:44px;min-height:44px;font-size:18px;">−</div><div class="mono" style="width:20px;text-align:center;font-weight:600;">0</div><div class="btn ghost" style="width:44px;min-height:44px;font-size:18px;">+</div></div></div><div class="card" style="padding:13px;display:flex;justify-content:space-between;align-items:center;gap:12px;"><div style="min-width:0;"><div style="font-weight:600;">Standard</div><div class="sub"><span class="mono">₩15,000</span> ≈ <span class="mono">$11.10</span> · 62 left</div></div><div style="display:flex;align-items:center;gap:10px;flex:none;"><div class="btn ghost" style="width:44px;min-height:44px;font-size:18px;">−</div><div class="mono" style="width:20px;text-align:center;font-weight:600;">2</div><div class="btn ghost" style="width:44px;min-height:44px;font-size:18px;">+</div></div></div>
    <div class="sub">Up to 4 tickets per person for one show.</div>
  </div>
  <div style="margin-top:auto;padding:12px 20px 20px;background:var(--surface);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;"><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;"><span class="sub">Total</span><div style="text-align:right;"><span class="mono" style="font-size:19px;font-weight:600;">₩30,000</span> <span class="sub mono">≈ $22.20</span></div></div><div class="btn amber">Next</div></div>
</div>
</x-dc>
</body>
</html>
